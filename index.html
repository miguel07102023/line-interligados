window.shuffleArray=function(array){
  const arr=[...array];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
};

window.chooseRandomCandidate=function(candidates,usedThisPreview,history,roleName){
  const eligible=candidates.filter(m=>!usedThisPreview.has(String(m.id)));
  if(!eligible.length)return null;

  const roleHistory=history.roleUsers[roleName] || new Set();

  // 1) Prioridade máxima: pessoa que ainda não apareceu em nenhum sorteio
  //    desta sessão para este evento.
  let pool=eligible.filter(m=>!history.users.has(String(m.id)));

  // 2) Se todos já apareceram em alguma função, tenta alguém que ainda não
  //    apareceu especificamente nesta função.
  if(!pool.length){
    pool=eligible.filter(m=>!roleHistory.has(String(m.id)));
  }

  // 3) Quando todas as opções já rodaram, libera repetição.
  if(!pool.length)pool=eligible;

  const shuffled=shuffleArray(pool);
  return shuffled[0]||null;
};

window.chooseBalancedCandidate=function(candidates,usedThisPreview){
  const eligible=candidates.filter(m=>!usedThisPreview.has(String(m.id)));
  if(!eligible.length)return null;

  // Empates recebem um pequeno fator aleatório para que "Gerar novamente"
  // consiga variar sem abandonar a lógica de equilíbrio.
  return eligible
    .map(m=>({
      m,
      load:memberScheduleCount(m.id),
      tie:Math.random()
    }))
    .sort((a,b)=>a.load-b.load || a.tie-b.tie)[0]?.m || null;
};

window.memberScheduleCount = function(userId){
  return V8.schedules.filter(s=>s.user_id===userId&&s.status!=="replaced").length;
}
window.availabilityScore = function(eventId,userId){
  const st=availabilityFor(eventId,userId);
  return st==="available"?100:-1000;
}
window.generateAIPreview = async function(){
  const eventSelect=document.getElementById("aiEvent");
  const ruleSelect=document.getElementById("aiRule");
  const output=document.getElementById("aiOutput");
  const btn=document.getElementById("aiGenerateBtn");
  const eventId=Number(eventSelect?.value);
  const event=eventById(eventId);
  const strategy=ruleSelect?.value||"random";

  if(!event||!output||!btn)return;

  btn.disabled=true;
  btn.classList.add("is-loading");
  btn.innerHTML=`${icon("loader-circle")}<span>${strategy==="random"?"Realizando sorteio...":"Analisando dados..."}</span>`;
  refreshIcons();

  const steps=strategy==="random"
    ?[
      ["users-round","Conferindo quem marcou Disponível",34],
      ["shuffle","Sorteando entre os membros elegíveis",67],
      ["refresh-cw","Evitando repetir a sugestão anterior",100]
    ]
    :[
      ["users-round","Conferindo quem marcou Disponível",34],
      ["scale","Equilibrando carga entre os membros",67],
      ["clipboard-check","Montando a combinação",100]
    ];

  output.innerHTML=`<div class="ai-loading-card">
    <div class="ai-loading-head">
      <div class="ai-thinking-icon">${icon(strategy==="random"?"shuffle":"brain-circuit")}</div>
      <div><b>${strategy==="random"?"A LINE está realizando o sorteio":"A LINE IA está preparando a escala"}</b><p>Isso leva apenas alguns segundos.</p></div>
    </div>
    <div class="ai-loading-step" id="aiLoadingStep">${icon(steps[0][0])}<span>${steps[0][1]}</span></div>
    <div class="ai-progress"><span id="aiProgressBar" style="width:${steps[0][2]}%"></span></div>
  </div>`;
  refreshIcons();

  for(let i=0;i<steps.length;i++){
    const step=steps[i];
    const stepEl=document.getElementById("aiLoadingStep");
    const bar=document.getElementById("aiProgressBar");
    if(stepEl)stepEl.innerHTML=`${icon(step[0])}<span>${step[1]}</span>`;
    if(bar)bar.style.width=`${step[2]}%`;
    refreshIcons();
    await new Promise(resolve=>setTimeout(resolve,300));
  }

  const operational=V8.teams.filter(t=>
    ["Story","Fotos","Design","Projeção","Reels","Edição","Social Media"].includes(t.name)
  );

  // Monta os pools antes para começar pelas áreas com menos opções.
  // Isso reduz a chance de uma pessoa multi-equipe ocupar uma função e deixar
  // outra função sem ninguém.
  const teamPools=operational.map(team=>{
    const ids=V8.memberTeams
      .filter(mt=>Number(mt.team_id)===Number(team.id))
      .map(mt=>String(mt.user_id));

    const candidates=V8.members.filter(m=>
      ids.includes(String(m.id)) &&
      m.active &&
      m.role==="member" &&
      m.name!=="Michel Macedo" &&
      availabilityFor(eventId,m.id)==="available"
    );

    return {team,candidates};
  });

  const processingOrder=[...teamPools].sort((a,b)=>
    a.candidates.length-b.candidates.length ||
    String(a.team.name).localeCompare(String(b.team.name),"pt-BR")
  );

  const preview=[];
  const unfilled=[];
  const usedThisPreview=new Set();
  const history=getAIDrawHistory(eventId,strategy);

  processingOrder.forEach(({team,candidates})=>{
    let selected=null;

    if(strategy==="random"){
      selected=chooseRandomCandidate(candidates,usedThisPreview,history,team.name);
    }else{
      selected=chooseBalancedCandidate(candidates,usedThisPreview);
    }

    if(selected){
      usedThisPreview.add(String(selected.id));

      const score=strategy==="balanced"
        ?Math.max(0,100-memberScheduleCount(selected.id)*3)
        :null;

      preview.push({
        teamId:team.id,
        role:team.name,
        userId:selected.id,
        memberName:selected.name,
        score,
        strategy
      });
    }else{
      unfilled.push(team.name);
    }
  });

  // Volta à ordem visual padrão das equipes.
  const visualOrder=new Map(operational.map((t,index)=>[String(t.id),index]));
  preview.sort((a,b)=>
    (visualOrder.get(String(a.teamId))??999)-(visualOrder.get(String(b.teamId))??999)
  );

  // Só depois de concluir a geração registramos quem apareceu.
  // Assim a geração seguinte consegue priorizar pessoas diferentes.
  if(strategy==="random" && preview.length){
    history.generations+=1;
    preview.forEach(item=>{
      const userId=String(item.userId);
      history.users.add(userId);
      if(!history.roleUsers[item.role])history.roleUsers[item.role]=new Set();
      history.roleUsers[item.role].add(userId);
    });
  }

  V8.aiPreview=preview;

  if(preview.length){
    const strategyTitle=strategy==="random"?"Sorteio gerado":"Sugestão equilibrada";
    const strategyIcon=strategy==="random"?"shuffle":"sparkles";

    output.innerHTML=`<div class="ai-result-header">
      <div>
        <span class="ai-result-kicker">${icon(strategyIcon)}${strategyTitle}</span>
        <h4>${event.name}</h4>
        <p>${formatEventDate(event.event_date)} • ${event.start_time?.slice(0,5)||"Horário não informado"}</p>
      </div>
      <span class="status confirmed">${icon("circle-check")}Sem duplicidade de membro</span>
    </div>

    <div class="ai-preview ai-preview-premium">
      ${preview.map(a=>{
        const member=memberById(a.userId);
        return `<div class="ai-preview-row ai-preview-person">
          <div class="ai-role-icon">${icon(
            a.role==="Design"?"palette":
            a.role==="Fotos"?"camera":
            a.role==="Story"?"smartphone":
            a.role==="Reels"?"clapperboard":
            a.role==="Projeção"?"monitor":
            a.role==="Edição"?"scissors":
            "send"
          )}</div>
          <div class="ai-role-copy">
            <small>${a.role}</small>
            <div class="ai-person-line">
              ${avatarHTML(member,"avatar")}
              <b>${a.memberName}</b>
            </div>
          </div>
          ${strategy==="random"
            ?`<span class="ai-score ai-draw-badge">${icon("shuffle")} Sorteado</span>`
            :`<span class="ai-score">Score ${a.score}</span>`}
        </div>`;
      }).join("")}
    </div>

    <div class="ai-quality-grid">
      ${strategy==="random"
        ?`<div>${icon("shuffle")}<span><b>Sorteio renovado</b><small>Ao gerar novamente, o sistema prioriza quem ainda não apareceu.</small></span></div>`
        :`<div>${icon("check")}<span><b>Carga equilibrada</b><small>Prioridade para quem possui menos escalas no histórico.</small></span></div>`}
      <div>${icon("check")}<span><b>Disponibilidade conferida</b><small>Somente quem marcou Disponível entrou na análise.</small></span></div>
    </div>

    ${unfilled.length?`<div class="ai-unfilled-warning">
      ${icon("triangle-alert")}
      <div><b>Funções sem pessoa disponível</b><p>${unfilled.join(", ")}</p></div>
    </div>`:""}

    <div class="ai-result-actions">
      <button class="secondary ai-regenerate-btn" onclick="generateAIPreview()">${icon("refresh-cw")}Gerar novamente</button>
      <button class="primary ai-apply-btn" onclick="publishAISchedule(${eventId})">${icon("circle-check")}Aplicar esta escala</button>
    </div>

    <div class="integration-note">
      ${strategy==="random"
        ?"Cada novo sorteio tenta trazer pessoas diferentes. Repetições só acontecem quando as alternativas elegíveis daquela função já foram usadas."
        :"A escala equilibrada considera disponibilidade e quantidade de escalas anteriores."}
      Ao aplicar, cada membro escalado receberá uma notificação interna para confirmar ou recusar.
    </div>`;
  }else{
    output.innerHTML=`<div class="ai-empty-state ai-empty-warning">
      <div class="ai-empty-icon">${icon("user-round-x")}</div>
      <div><b>Ninguém disponível para gerar a escala</b><p>É necessário que os membros marquem Disponível para este evento antes de entrarem na sugestão.</p></div>
    </div>`;
  }

  btn.disabled=false;
  btn.classList.remove("is-loading");
  btn.innerHTML=`${icon("sparkles")}<span>Gerar sugestão de escala</span>`;
  refreshIcons();
}

window.publishAISchedule = async function(eventId){
  if(!V8.aiPreview.length)return;
  const rows=V8.aiPreview.map(a=>({
    event_id:Number(eventId),user_id:a.userId,team_id:a.teamId,role_name:a.role,status:"pending",generated_by_ai:true
  }));
  // Remove apenas sugestões IA pendentes antigas para o mesmo evento.
  await supabaseClient.from("schedules").delete().eq("event_id",eventId).eq("generated_by_ai",true).eq("status","pending");
  const {data,error}=await supabaseClient.from("schedules").insert(rows).select();
  if(error){console.error(error);alert("Não foi possível publicar a escala.");return}
  const event=eventById(eventId);
  // Notificações internas
  const notifications=(data||[]).map(s=>({
    user_id:s.user_id,title:"Você foi escalado",message:`${s.role_name} • ${event.name} • ${formatEventDate(event.event_date)} às ${event.start_time?.slice(0,5)||""}`,
    type:"schedule",related_event_id:event.id
  }));
  if(notifications.length){
    const nres=await supabaseClient.from("notifications").insert(notifications);

window.fetchTeamTasks=async function(teamId,force=false){
  const id=Number(teamId);
  const cached=TEAM_TASK_CACHE.get(id);
  if(!force && cached && Date.now()-cached.at<TEAM_TASK_CACHE_MS)return cached.data;

  const result=await Promise.race([
    supabaseClient.from("team_tasks").select("*").eq("team_id",id).order("created_at",{ascending:false}),
    new Promise(resolve=>setTimeout(()=>resolve({data:cached?.data||[],error:new Error("tasks timeout")}),5000))
  ]);

  if(!result.error){
    TEAM_TASK_CACHE.set(id,{data:result.data||[],at:Date.now()});
  }
  return result.data||cached?.data||[];
}

window.createTeamTask=async function(teamId){
  if(!isMaster())return;
  const assignee=document.getElementById("taskAssignee").value||null;
  const eventId=document.getElementById("taskEvent")?.value||null;
  const due=document.getElementById("taskDue").value;
  const publish=document.getElementById("taskPublish").value;
  const title=document.getElementById("taskTitle").value.trim();
  const description=document.getElementById("taskDescription").value.trim()||null;
  const checklist=document.getElementById("taskChecklist").value.trim()||null;
  const status=document.getElementById("taskStatus").value;
  if(!title)return alert("Informe o título.");
  const {data,error}=await supabaseClient.rpc("master_create_team_task",{
    p_team_id:Number(teamId),p_event_id:eventId?Number(eventId):null,p_title:title,p_description:description,
    p_assignee_id:assignee||null,p_status:status,p_due_at:due?new Date(due).toISOString():null,
    p_publish_at:publish?new Date(publish).toISOString():null,p_checklist_text:checklist
  });

window.uploadTaskFile=async function(taskId){
  const input=document.getElementById(`taskFile-${taskId}`);
  const file=input?.files?.[0];
  if(!file)return alert("Selecione um arquivo.");
  if(file.size>80*1024*1024)return alert("O arquivo deve ter no máximo 80 MB.");

  const safe=file.name.toLowerCase().replace(/[^a-z0-9._-]+/g,"-");
  const path=`tasks/${taskId}/${Date.now()}-${safe}`;
  const {data,error}=await supabaseClient.storage.from("line-files").upload(path,file,{contentType:file.type,upsert:false});
  if(error){console.error(error);alert("Não foi possível enviar o arquivo.");return}

  const {data:urlData}=supabaseClient.storage.from("line-files").getPublicUrl(data.path);
  const {error:updateError}=await supabaseClient.from("team_tasks").update({
    attachment_path:data.path,
    attachment_url:urlData.publicUrl,
    attachment_name:file.name,
    updated_at:new Date().toISOString()
  }).eq("id",taskId);
  if(updateError){console.error(updateError);alert("Arquivo enviado, mas não foi possível vinculá-lo à tarefa.");return}

  alert("Arquivo enviado para a tarefa.");
  closeModal();
  await openTaskDetail(taskId);
}

window.changeTaskStatus=async function(taskId,status){
  const {data:t,error:fetchError}=await supabaseClient.from("team_tasks").select("*").eq("id",taskId).single();
  if(fetchError||!t)return;

  const {error}=await supabaseClient.from("team_tasks").update({status,updated_at:new Date().toISOString()}).eq("id",taskId);
  if(error){console.error(error);alert("Não foi possível alterar o status.");return}

  if(status==="review"){
    await supabaseClient.from("notifications").insert({
      user_id:t.created_by,title:"Tarefa pronta para revisão",message:`${t.title} foi enviada para revisão.`,type:"task"
    });
  }

  if(status==="production" && t.assignee_id){
    await supabaseClient.from("notifications").insert({
      user_id:t.assignee_id,title:"Ajuste solicitado",message:`A tarefa ${t.title} voltou para produção.`,type:"task"
    });
  }

  if(status==="publishing"){
    // Notifica Social Media escalado(s) para o evento; se não houver evento, notifica todos da equipe Social Media.
    const social=V8.teams.find(x=>x.name==="Social Media");
    let ids=[];
    if(t.event_id && social){
      ids=V8.schedules
        .filter(s=>Number(s.event_id)===Number(t.event_id)&&Number(s.team_id)===Number(social.id)&&s.status!=="declined"&&s.status!=="replaced")
        .map(s=>s.user_id);
    }
    if(!ids.length && social){
      ids=V8.memberTeams.filter(mt=>Number(mt.team_id)===Number(social.id)).map(mt=>mt.user_id);
    }
    ids=[...new Set(ids)];
    if(ids.length){
      await supabaseClient.from("notifications").insert(ids.map(id=>({
        user_id:id,
        title:"Material pronto para publicação",
        message:`${t.title} foi aprovado e já está disponível no LINE.`,
        type:"task"
      })));
    }
  }

  closeModal();await render();
}

      </div>`;
    }
  }

  const adminStatus=isMaster()?`<div class="field" style="margin-top:12px"><label>Alterar status manualmente</label><select class="task-status-select" onchange="changeTaskStatus(${t.id},this.value)">${TASK_STATUS_ORDER.map(s=>`<option value="${s}" ${t.status===s?"selected":""}>${TASK_STATUS_LABELS[s]}</option>`).join("")}</select></div>`:"";

  document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="panel-head"><div class="panel-title">${icon("clipboard-check")}${t.title}</div><span class="status purple-tag">${TASK_STATUS_LABELS[t.status]||t.status}</span></div>

      ${t.due_at?`<br><b>Prazo:</b> ${new Date(t.due_at).toLocaleString("pt-BR")}`:""}

window.normalizeApplicationStatus=function(status){
  const value=String(status||"pending").toLowerCase().trim();
  if(["approved","aprovado","aprovada","aceito","aceita"].includes(value))return "approved";
  if(["rejected","not_approved","não aprovado","nao aprovado","reprovado","reprovada","recusado","recusada"].includes(value))return "rejected";
  return "pending";
};
window.applicationStatusLabel=function(status){
  const normalized=normalizeApplicationStatus(status);
  return normalized==="approved"?"Aprovado":normalized==="rejected"?"Não aprovado":"Pendente";
};
window.applicationStatusIcon=function(status){
  const normalized=normalizeApplicationStatus(status);
  return normalized==="approved"?"circle-check":normalized==="rejected"?"circle-x":"clock-3";
};
window.setApplicationStatusFilter=async function(filter){
  applicationStatusFilter=["all","pending","approved","rejected"].includes(filter)?filter:"all";
  await render();
};


window.loadApplications=async function(){
  if(!isMaster())return [];
  const attempts=["applications","candidaturas"];
  for(const table of attempts){
    try{
      const {data,error}=await supabaseClient
        .from(table)
        .select("*")
        .order("created_at",{ascending:false});
      if(!error){
        window.lineApplications=(data||[]).map(item=>({...item,__table:table}));
        return window.lineApplications;
      }
    }catch(error){
      console.warn("Falha ao carregar",table,error);
    }
  }
  window.lineApplications=[];
  return [];
};

window.deleteApplication=async function(id,table="applications"){
  if(!isMaster()){alert("Apenas Masters podem apagar candidaturas.");return;}
  const item=lineApplications.find(a=>String(a.id)===String(id));
  const name=item?.name||item?.nome||"esta pessoa";
  if(!confirm(`Apagar definitivamente a candidatura de ${name}? Ela será removida do app e do site.`))return;
  try{
    let deleted=false;
    const rpcResult=await supabaseClient.rpc("master_delete_application",{p_application_id:String(id),p_table_name:table});
    if(!rpcResult.error){deleted=true;}else{
      console.warn("RPC de exclusão indisponível; tentando exclusão direta.",rpcResult.error);
      const direct=await supabaseClient.from(table).delete().eq("id",id);
      if(direct.error)throw direct.error;
      deleted=true;
    }
    if(!deleted)throw new Error("A candidatura não foi removida.");
    closeModal();
    lineApplications=lineApplications.filter(a=>String(a.id)!==String(id));
    alert("Candidatura apagada do app e do site com sucesso.");
    await render();
  }catch(error){
    console.error("Erro ao apagar candidatura:",error);
    alert("Não foi possível apagar a candidatura. Rode o SQL da v11.3 no Supabase e tente novamente.\n\n"+(error?.message||error));
  }
};
window.updateApplicationStatus=async function(id,status,table="applications"){
  if(!isMaster()){alert("Apenas Masters podem alterar o estágio.");return;}
  const normalized=normalizeApplicationStatus(status);
  try{
    const rpcResult=await supabaseClient.rpc("master_update_application_status",{p_application_id:String(id),p_status:normalized,p_table_name:table});
    if(rpcResult.error){
      console.warn("RPC de estágio indisponível; tentando atualização direta.",rpcResult.error);
      const direct=await supabaseClient.from(table).update({status:normalized}).eq("id",id);
      if(direct.error)throw direct.error;
    }
    lineApplications=lineApplications.map(a=>String(a.id)===String(id)?{...a,status:normalized}:a);
    closeModal();
    await render();
  }catch(error){
    console.error("Erro ao atualizar estágio:",error);
    alert("Não foi possível atualizar o estágio. Rode o SQL da v11.3 no Supabase.\n\n"+(error?.message||error));
  }
};

window.urlBase64ToUint8Array = function(base64String){
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
};

window.getPushStatusV13 = async function(){
  const supported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  const permission = supported ? Notification.permission : "unsupported";
  let subscribed = false;
  try{
    if(supported){
      const reg = await getLineServiceWorkerRegistration();
      subscribed = Boolean(await reg.pushManager.getSubscription());
    }
  }catch{}
  return {supported, permission, subscribed, standalone:lineIsStandalone(), ios:lineIsIOS()};
};

  };
  const {error} = await supabaseClient.from("push_subscriptions").upsert(payload,{onConflict:"endpoint"});
  if(error) throw error;
};

      alert("Permissão de notificações não concedida. Você pode alterá-la nas configurações do aparelho/navegador.");
      return;
    }

    const reg = await getLineServiceWorkerRegistration();
    let sub = await reg.pushManager.getSubscription();

      sub = await reg.pushManager.subscribe({

window.sendMasterPushTestV135 = async function(){
  try{
    if(!isMaster()){
      alert("Apenas administradores Master podem usar este teste.");
      return;
    }
    if(!currentUser?.id){
      alert("Usuário não autenticado.");
      return;
    }

    const btn=document.getElementById("masterPushTestBtnV135");
    if(btn){
      btn.disabled=true;
      btn.dataset.oldText=btn.innerHTML;
      btn.innerHTML=`${icon("loader-circle")} Enviando...`;
      refreshIcons();
    }

    const {data,error}=await supabaseClient.functions.invoke("send-line-push",{
      body:{
        user_ids:[currentUser.id],
        title:"LINE Interligados 🔔",
        body_template:"Teste concluído! As notificações da LINE estão funcionando.",
        role_by_user:{},
        url:"/#notificacoes",
        tag:`master-push-test-${Date.now()}`
      }
    });

    if(error){
      console.error("Teste Push Master:",error);
      alert("Não foi possível enviar o Push de teste. Confira os logs da função send-line-push.");
      return;
    }

    const sent=Number(data?.sent||0);
    const failed=Number(data?.failed||0);

    if(sent>0){
      alert(`Push de teste enviado com sucesso para ${sent} aparelho(s). 🔔`);
    }else if(failed>0){
      alert("O teste foi executado, mas o envio falhou. Confira os logs de Push.");
    }else{
      alert("Nenhum aparelho ativo encontrado para o seu usuário. Ative as notificações neste aparelho e tente novamente.");
    }
  }catch(error){
    console.error(error);
    alert("Erro ao executar o teste de Push.");
  }finally{
    const btn=document.getElementById("masterPushTestBtnV135");
    if(btn){
      btn.disabled=false;
      btn.innerHTML=btn.dataset.oldText||`${icon("send")} Enviar Push de teste para mim`;

(function installLineActionFeedbackV136(){
  function wrapAsync(name, resolver){
    const original=window[name];
    if(typeof original!=="function" || original.__lineV136Wrapped)return false;
    const wrapped=async function(...args){
      const clicked=document.activeElement;
      try{
        const result=await original.apply(this,args);
        const feedback=resolver(args,result);
        if(feedback){
          linePulseActionV136(clicked);
          lineActionFeedbackV136(feedback);
        }
        return result;
      }catch(err){
        throw err;
      }
    };
    wrapped.__lineV136Wrapped=true;
    window[name]=wrapped;
    return true;
  }

  // Disponibilidade: o app atual usa saveAvailability.
  wrapAsync("saveAvailability",()=>({
    tone:"success",
    icon:"check",
    title:"Disponibilidade salva!",
    message:"Sua resposta foi registrada na LINE."
  }));

  // Confirmação/recusa de escala: cobre os nomes usados nas versões atuais/anteriores.
  ["confirmSchedule","confirmScale","confirmAssignment","acceptSchedule"].forEach(name=>{
    wrapAsync(name,()=>({
      tone:"success",
      icon:"check-circle",
      title:"Escala confirmada!",
      message:"Tudo certo. Sua confirmação foi registrada."
    }));
  });
  ["declineSchedule","declineScale","declineAssignment","rejectSchedule"].forEach(name=>{
    wrapAsync(name,()=>({
      tone:"danger",
      icon:"x-circle",
      title:"Escala recusada",
      message:"Sua resposta foi registrada."
    }));
  });
})();

  window.addEventListener("load",async()=>{
    try{
      const registration=await navigator.serviceWorker.register("./service-worker.js?v=14.3",{updateViaCache:"none"});
      await registration.update();

      // Quando uma nova versão assumir o controle, recarrega uma única vez.
      navigator.serviceWorker.addEventListener("controllerchange",()=>{
        if(sessionStorage.getItem("line-sw-reloaded")==="1")return;
        sessionStorage.setItem("line-sw-reloaded","1");
        location.reload();
      });

      // Se já existir SW aguardando, pede ativação imediata.
      if(registration.waiting){

      }
    }catch(err){
      console.warn("Service Worker:",err);
    }
  });

  const cached=LINE_BOARD_DATA_CACHE.get(id);
  if(!force && cached && Date.now()-cached.at<5000)return cached.data;

  const tasks=await fetchTeamTasks(id,force);
  const ids=tasks.map(t=>Number(t.id));
  let labels=[],taskLabels=[],assignees=[],checklists=[],comments=[],attachments=[],activity=[],templates=[];

  const safe=async(q)=>{
    try{const r=await q;if(r.error){console.warn(r.error.message);return []}return r.data||[]}
    catch(e){console.warn(e);return []}
  };

  labels=await safe(supabaseClient.from("board_labels").select("*").eq("team_id",id).order("name"));
  templates=await safe(supabaseClient.from("task_templates").select("*").eq("team_id",id).eq("active",true).order("name"));

  if(ids.length){
    taskLabels=await safe(supabaseClient.from("task_label_links").select("*").in("task_id",ids));
    assignees=await safe(supabaseClient.from("task_assignees").select("*").in("task_id",ids));
    checklists=await safe(supabaseClient.from("task_checklist_items").select("*").in("task_id",ids).order("position"));
    comments=await safe(supabaseClient.from("task_comments").select("*").in("task_id",ids).order("created_at"));
    attachments=await safe(supabaseClient.from("task_attachments").select("*").in("task_id",ids).order("created_at"));
    activity=await safe(supabaseClient.from("task_activity").select("*").in("task_id",ids).order("created_at",{ascending:false}));
  }

  const data={tasks,labels,taskLabels,assignees,checklists,comments,attachments,activity,templates};
  LINE_BOARD_DATA_CACHE.set(id,{at:Date.now(),data});
  return data;
};

window.taskAssigneesV12=function(taskId,bundle){

};
window.taskLabelsV12=function(taskId,bundle){
  const ids=(bundle.taskLabels||[]).filter(x=>Number(x.task_id)===Number(taskId)).map(x=>Number(x.label_id));
  return (bundle.labels||[]).filter(l=>ids.includes(Number(l.id)));
};
window.taskChecklistV12=function(taskId,bundle){
  return (bundle.checklists||[]).filter(x=>Number(x.task_id)===Number(taskId));
};
window.taskCommentsV12=function(taskId,bundle){
  return (bundle.comments||[]).filter(x=>Number(x.task_id)===Number(taskId));
};
window.taskAttachmentsV12=function(taskId,bundle){
  return (bundle.attachments||[]).filter(x=>Number(x.task_id)===Number(taskId));

window.taskActivityV12=function(taskId,bundle){

window.filteredBoardTasks=function(teamId,bundle){
  const f=boardFiltersFor(teamId);
  const q=(f.q||"").trim().toLowerCase();
  return (bundle.tasks||[]).filter(t=>{
    if(t.archived_at)return false;
    const ass=taskAssigneesV12(t.id,bundle);
    const labs=taskLabelsV12(t.id,bundle);
    if(q && !`${t.title||""} ${t.description||""}`.toLowerCase().includes(q))return false;
    if(f.member!=="all" && !ass.some(m=>String(m.id)===String(f.member)))return false;
    if(f.label!=="all" && !labs.some(l=>String(l.id)===String(f.label)))return false;
    return true;
  });
};

  bundle=bundle||{assignees:[],labels:[],taskLabels:[],checklists:[],comments:[],attachments:[]};

window.boardDragStart=function(event,taskId){
  event.dataTransfer.setData("text/plain",String(taskId));
  event.dataTransfer.effectAllowed="move";
  event.currentTarget.classList.add("dragging");
};
window.boardDragEnd=function(event){
  event.currentTarget.classList.remove("dragging");
  document.querySelectorAll(".kanban-col-v12").forEach(x=>x.classList.remove("drag-over"));
};
window.boardDragOver=function(event){event.preventDefault();event.currentTarget.classList.add("drag-over")};
window.boardDragLeave=function(event){event.currentTarget.classList.remove("drag-over")};
window.boardDrop=async function(event,teamId,status){
  event.preventDefault();event.currentTarget.classList.remove("drag-over");
  const taskId=Number(event.dataTransfer.getData("text/plain"));
  if(!taskId)return;
  const {error}=await supabaseClient.rpc("move_task_card",{p_task_id:taskId,p_status:status,p_position:Date.now()});
  if(error){console.error(error);alert("Não foi possível mover este card.");return}
  invalidateBoard(teamId);
  await render();
};

window.monthStartMonday=function(date){
  const d=new Date(date.getFullYear(),date.getMonth(),1);
  const day=(d.getDay()+6)%7;
  d.setDate(d.getDate()-day);
  return d;
};
window.renderCalendarV12=function(teamId,bundle,tasks){
  const today=new Date();
  const start=monthStartMonday(today);
  const days=Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return d});
  return `<div class="panel">
    <div class="panel-head"><div class="panel-title">${icon("calendar-days")}${today.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</div></div>
    <div class="board-calendar-v12">${days.map(d=>{
      const iso=d.toISOString().slice(0,10);
      const dayTasks=tasks.filter(t=>t.due_at && String(t.due_at).slice(0,10)===iso);
      const muted=d.getMonth()!==today.getMonth();
      return `<div class="board-calendar-day ${muted?"board-calendar-empty":""}">
        <strong>${d.getDate()}</strong>
        ${dayTasks.map(t=>`<div class="board-calendar-task" onclick="openTaskDetail(${t.id})">${escapeHTML(t.title)}</div>`).join("")}
      </div>`;
    }).join("")}</div>

};

window.renderTimelineV12=function(teamId,bundle,tasks){
  const dated=tasks.filter(t=>t.start_at||t.due_at);
  if(!dated.length)return `<div class="panel"><div class="empty-state">Adicione data de início ou prazo aos cards para usar a Timeline.</div></div>`;
  const dates=dated.flatMap(t=>[t.start_at,t.due_at].filter(Boolean).map(x=>new Date(x).getTime()));
  const min=Math.min(...dates),max=Math.max(...dates, min+86400000);
  const span=max-min||86400000;
  return `<div class="panel"><div class="timeline-v12">${dated.map(t=>{
    const s=t.start_at?new Date(t.start_at).getTime():(t.due_at?new Date(t.due_at).getTime():min);
    const e=t.due_at?new Date(t.due_at).getTime():s+86400000;
    const left=Math.max(0,Math.min(95,(s-min)/span*100));
    const width=Math.max(5,Math.min(100-left,(e-s)/span*100));
    return `<div class="timeline-row-v12">
      <div class="timeline-name-v12 clickable" onclick="openTaskDetail(${t.id})">${escapeHTML(t.title)}</div>
      <div class="timeline-track-v12"><div class="timeline-bar-v12" style="left:${left}%;width:${width}%;background:${BOARD_STATUS_COLORS[t.status]||"#245f8e"}">${TASK_STATUS_LABELS[t.status]||""}</div></div>
    </div>`;
  }).join("")}</div></div>`;
};

window.renderDashboardV12=function(teamId,bundle,tasks){
  const overdue=tasks.filter(t=>t.due_at&&new Date(t.due_at)<new Date()&&t.status!=="done").length;
  const complete=tasks.filter(t=>t.status==="done").length;
  const total=tasks.length;
  const statuses=["ideas","todo","production","review","publishing"];
  const counts=statuses.map(s=>tasks.filter(t=>t.status===s).length);
  const max=Math.max(1,...counts);
  const openTotal=counts.reduce((a,b)=>a+b,0);

  let acc=0;
  const angles=counts.map(n=>{
    acc+=(openTotal? n/openTotal : 0)*360;
    return Math.round(acc*100)/100;
  });
  if(!openTotal){angles[0]=angles[1]=angles[2]=angles[3]=0;angles[4]=360}

  const colors=["#64748b","#3b82f6","#f59e0b","#a855f7","#14b8a6"];
  const pieBackground=openTotal
    ?`conic-gradient(${colors.map((c,i)=>`${c} ${i===0?0:angles[i-1]}deg ${angles[i]}deg`).join(",")})`
    :"conic-gradient(#132436 0 360deg)";

  return `<div class="board-dashboard-v12">
    <div class="board-dashboard-card"><small>Tarefas abertas</small><b>${tasks.filter(t=>t.status!=="done").length}</b></div>
    <div class="board-dashboard-card"><small>Atrasadas</small><b>${overdue}</b></div>
    <div class="board-dashboard-card"><small>Publicadas</small><b>${complete}</b></div>
    <div class="board-dashboard-card"><small>Conclusão</small><b>${total?Math.round(complete/total*100):0}%</b></div>

    <div class="board-dashboard-card board-dashboard-span">
      <small>Distribuição dos cards</small>
      <div class="board-dashboard-pie-v121">
        <div class="board-pie-wrap-v121">
          <div class="board-pie-v121" style="background:${pieBackground}"></div>
          <div class="board-pie-center-v121"><b>${openTotal}</b><small>cards ativos</small></div>
        </div>
        <div class="board-pie-legend-v121">
          ${statuses.map((s,i)=>`<div class="board-pie-row-v121">
            <span class="board-pie-dot-v121" style="background:${colors[i]}"></span>
            <span>${TASK_STATUS_LABELS[s]}</span><b>${counts[i]}</b>
          </div>`).join("")}
        </div>
      </div>
    </div>

    <div class="board-dashboard-card board-dashboard-span"><small>Cards por etapa</small>
      <div class="board-status-bars">${statuses.map(s=>{
        const n=tasks.filter(t=>t.status===s).length;
        return `<div class="board-status-row"><span>${TASK_STATUS_LABELS[s]}</span><div class="board-status-bar"><span style="width:${n/max*100}%;background:${BOARD_STATUS_COLORS[s]}"></span></div><b>${n}</b></div>`;
      }).join("")}</div>
    </div>

    <div class="board-dashboard-card board-dashboard-span"><small>Responsáveis mais ativos</small>
      <div class="board-status-bars">${[...new Set((bundle.assignees||[]).map(a=>String(a.user_id)))].map(id=>{
        const m=memberById(id);const n=(bundle.assignees||[]).filter(a=>String(a.user_id)===id).length;
        return {m,n};
      }).filter(x=>x.m).sort((a,b)=>b.n-a.n).slice(0,6).map(x=>`<div class="board-status-row"><span>${escapeHTML(x.m.name.split(" ")[0])}</span><div class="board-status-bar"><span style="width:${Math.min(100,x.n*18)}%"></span></div><b>${x.n}</b></div>`).join("")||`<div class="board-empty-v12">Sem responsáveis.</div>`}
      </div>
    </div>
  </div>`;
};

window.createTeamTaskV12=async function(teamId){
  if(!isMaster())return;
  const title=document.getElementById("taskTitle")?.value.trim();
  if(!title)return alert("Informe o título.");
  const assignees=[...document.querySelectorAll(".taskAssigneeV12:checked")].map(x=>x.value);
  const labels=[...document.querySelectorAll(".taskLabelV12:checked")].map(x=>Number(x.value));
  const checklist=(document.getElementById("taskChecklist")?.value||"").split("\n").map(x=>x.trim()).filter(Boolean);
  const payload={
    p_team_id:Number(teamId),
    p_event_id:document.getElementById("taskEvent")?.value?Number(document.getElementById("taskEvent").value):null,
    p_title:title,
    p_description:document.getElementById("taskDescription")?.value.trim()||null,
    p_status:document.getElementById("taskStatus")?.value||"todo",
    p_start_at:document.getElementById("taskStart")?.value?new Date(document.getElementById("taskStart").value).toISOString():null,
    p_due_at:document.getElementById("taskDue")?.value?new Date(document.getElementById("taskDue").value).toISOString():null,
    p_publish_at:document.getElementById("taskPublish")?.value?new Date(document.getElementById("taskPublish").value).toISOString():null,
    p_cover_color:document.getElementById("taskCoverColor")?.value||null,
    p_assignee_ids:assignees,
    p_label_ids:labels,
    p_checklist:checklist
  };
  const {data,error}=await supabaseClient.rpc("board_create_task",payload);
  if(error){console.error(error);alert("Não foi possível criar o card. Rode o SQL da v12.");return}
  invalidateBoard(teamId);closeModal();await render();
};

window.openTaskDetail=async function(taskId){

window.runBoardRPC=async function(name,args,teamId,taskId=null){
  const {error}=await supabaseClient.rpc(name,args);
  if(error){console.error(error);alert("Não foi possível concluir a ação. Confira se o SQL v12 foi rodado.");return false}
  invalidateBoard(teamId);
  if(taskId){closeModal();await openTaskDetail(taskId)}else await render();
  return true;
};

window.uploadTaskAttachmentV12=async function(taskId){
  const input=document.getElementById(`taskAttachV12-${taskId}`);
  const file=input?.files?.[0];if(!file)return;
  if(file.size>80*1024*1024)return alert("O arquivo deve ter no máximo 80 MB.");
  const {data:t}=await supabaseClient.from("team_tasks").select("team_id").eq("id",taskId).single();
  const safe=file.name.toLowerCase().replace(/[^a-z0-9._-]+/g,"-");
  const path=`boards/${t.team_id}/${taskId}/${Date.now()}-${safe}`;
  const up=await supabaseClient.storage.from("line-files").upload(path,file,{contentType:file.type,upsert:false});
  if(up.error){console.error(up.error);alert("Não foi possível enviar.");return}
  const {data:urlData}=supabaseClient.storage.from("line-files").getPublicUrl(up.data.path);
  const {error}=await supabaseClient.rpc("add_task_attachment",{
    p_task_id:taskId,p_name:file.name,p_url:urlData.publicUrl,p_path:up.data.path,p_mime_type:file.type||null,p_size:file.size
  });
  if(error){console.error(error);alert("Arquivo enviado, mas não foi possível vinculá-lo.");return}
  invalidateBoard(t.team_id);closeModal();await openTaskDetail(taskId);
};

    <div class="v14-availability-question">
      <span>Você estará disponível para servir?</span>
      <div class="v14-availability-actions">
        <button class="${av==="unavailable"?"selected-no":""}" onclick="setAvailabilityForEvent(${next.id},'unavailable')">Não estarei</button>
        <button class="${av==="available"?"selected-yes":""}" onclick="setAvailabilityForEvent(${next.id},'available')">Estou disponível</button>
      </div>
    </div>
  </article>`:`<article class="panel"><div class="empty-state">Nenhum evento futuro disponível.</div></article>`}

  <div class="v14-section-title">Eventos para se planejar</div>
  <section class="v14-event-list">
    ${upcoming.length?upcoming.map(e=>v14EventCard(e)).join(""):`<div class="v14-events-empty">Nenhum outro evento programado por enquanto.</div>`}
  </section>

  <div class="v14-section-title">Minhas escalas</div>
  <section class="v14-event-list">
    ${mySchedules.slice(0,3).map(sc=>{
      const e=eventById(sc.event_id); if(!e)return "";
      const t=teamById(sc.team_id);
      return v14EventCard(e,{meta:{team:t?.name||"LINE",role:sc.role_name||"Servir"},clickable:true});
    }).join("")||`<div class="v14-events-empty">Quando você for escalado, sua participação aparecerá aqui.</div>`}
  </section>

  ${await memberTasksWidget()}`;
};

window.dashboard=async function(){
  const upcoming=futureEvents();
  const first=upcoming[0];
  const members=(V8.members||[]).filter(m=>m.active).length;
  const pending=(V8.schedules||[]).filter(s=>s.status==="pending").length;
  const confirmed=(V8.schedules||[]).filter(s=>s.status==="confirmed").length;
  const declined=(V8.schedules||[]).filter(s=>s.status==="declined").length;

  return `<div class="v14-app-intro">
    <small>Olá, ${v14FirstName()}!</small>
    <h2>Visão geral da LINE</h2>
  </div>

  <section class="v14-master-stats">
    <div class="v14-mini-stat" onclick="openHomeInsight('members')"><small>Membros ativos</small><strong>${members}</strong></div>
    <div class="v14-mini-stat" onclick="openHomeInsight('events')"><small>Próximos eventos</small><strong>${upcoming.length}</strong></div>
    <div class="v14-mini-stat" onclick="openHomeInsight('pending')"><small>Pendentes</small><strong>${pending}</strong></div>
    <div class="v14-mini-stat" onclick="openHomeInsight('confirmed')"><small>Confirmados</small><strong>${confirmed}</strong></div>
  </section>

  <section class="v14-master-grid">
    <div>
      <div class="v14-section-title">Próximo evento</div>
      ${first?`<article class="master-next-card-v14" onclick="openEventDetail(${first.id})">
        <div class="v14-event-date">${formatEventDate(first.event_date)}</div>
        <h3 class="v14-event-name">${first.name}</h3>
        <div class="v14-event-sub">${first.location||"Local a confirmar"}</div>
        <div class="v14-event-info-grid">
          <div class="v14-info-pair"><small>Status</small><b>${eventStatusLabel(first.status)}</b></div>
          <div class="v14-info-pair"><small>Escalados</small><b>${(V8.schedules||[]).filter(s=>Number(s.event_id)===Number(first.id)&&s.status!=="replaced").length}</b></div>
          <div class="v14-big-time">${first.start_time?.slice(0,5)||"--:--"}</div>
        </div>
        <div class="v14-card-actions">
          <button class="v14-outline" onclick="event.stopPropagation();navigateLine('eventos')">Ver eventos</button>
          <button class="v14-solid" onclick="event.stopPropagation();navigateLine('escalas')">Abrir escalas</button>
        </div>
      </article>`:`<div class="v14-events-empty">Nenhum evento futuro.</div>`}
    </div>

    <div>
      <div class="v14-section-title">Resumo das escalas</div>
      <article class="panel v14-section-card">
        <div class="v14-compact-list">
          <div class="v14-compact-row"><div><b>Confirmadas</b><small>Presença garantida</small></div><span class="status green">${confirmed}</span></div>
          <div class="v14-compact-row"><div><b>Pendentes</b><small>Aguardando resposta</small></div><span class="status yellow">${pending}</span></div>
          <div class="v14-compact-row"><div><b>Recusadas</b><small>Não poderão servir</small></div><span class="status red">${declined}</span></div>
        </div>
        <button class="primary" style="width:100%;margin-top:14px" onclick="navigateLine('escalas')">Gerenciar escalas</button>
      </article>
    </div>
  </section>

  <div class="v14-section-title">Eventos para se planejar</div>
  <section class="v14-events-grid">
    ${upcoming.slice(1,5).map(e=>v14EventCard(e)).join("")||`<div class="v14-events-empty">Nenhum outro evento programado.</div>`}
  </section>`;
};

window.eventsPage=async function(){
  const events=[...(V8.events||[])].sort((a,b)=>String(a.event_date).localeCompare(String(b.event_date)));
  return `<div class="page-toolbar">
    <div class="page-title"><h2>Eventos</h2><p>Próximos encontros e programações da LINE.</p></div>
    ${isMaster()?`<button class="primary" onclick="openEventModal()">+ Novo evento</button>`:""}
  </div>
  <section class="v14-events-grid">
    ${events.length?events.map(e=>v14EventCard(e,{meta:{team:"LINE",role:eventStatusLabel(e.status)}})).join(""):`<div class="v14-events-empty">Nenhum evento cadastrado.</div>`}
  </section>`;
};

const v14SchedulesCore=window.schedulesPage;
window.schedulesPage=async function(){
  const markup=await v14SchedulesCore();
  if(!isMaster()){
    return markup
      .replace("<h2>Minhas escalas</h2>","<h2>Minhas escalas</h2>")
      .replace("Confirme ou recuse suas participações.","Tudo o que você precisa para servir, em um só lugar.");
  }
  return markup
    .replace("<h2>Escalas inteligentes</h2>","<h2>Escalas</h2>")
    .replace("Veja a disponibilidade real da equipe e monte a escala com a LINE IA.","Escale todos por equipe usando disponibilidade e inteligência da LINE.")
    .replace("Gerar sugestão de escala","Gerar escalas automaticamente");
};

window.notificationsPage=async function(){
  const items=V8.notifications||[];
  return `<div class="page-toolbar">
    <div class="page-title"><h2>Notificações</h2><p>Veja avisos, escalas e confirmações pendentes.</p></div>
    <button class="action-btn" onclick="enableLinePushNotifications()">${icon("bell-ring")} Ativar no celular</button>
  </div>
  <article class="panel">
    ${items.length?items.map(n=>`<div class="notification-item ${n.read_at?"read":"unread"} clickable" onclick="openNotificationDetail(${n.id})">
      <div class="notification-icon">${icon(n.type==="schedule"?"calendar-check":"bell")}</div>
      <div><b>${n.title}</b><p>${n.message}</p></div>
      ${n.read_at?`<span class="notification-time">${new Date(n.created_at).toLocaleDateString("pt-BR")}</span>`:`<span class="notification-dot"></span>`}
    </div>`).join(""):`<div class="notification-empty">Nenhuma notificação por enquanto.</div>`}
  </article>`;
};

/* keep current functional bottom dock, only redefine labels/active states */
window.mobileNav=function(){
  const items=[
    ["dashboard","house","Home"],
    ["eventos","calendar-days","Eventos"],
    ["escalas","calendar-check","Escalas"],
    ["manual","book-open-text","Manual"]
  ];
  const activePrimary=items.some(([r])=>route===r);
  return `<div class="mobile-dock-wrap-v125">
    <nav class="mobile-nav mobile-dock-v125">
      ${items.map(([r,i,l])=>`<a href="#${r}" onclick="event.preventDefault();navigateLine('${r}')" class="${route===r?"active":""}">
        <span class="mobile-dock-icon-v125">${icon(i)}</span>
        <span class="mobile-dock-label-v125">${l}</span>
      </a>`).join("")}
    </nav>
    <button class="mobile-plus-v125 ${!activePrimary?"active":""}" onclick="mobileMoreOpenV122()" aria-label="Mais">${icon("plus")}</button>
  </div>`;
};
