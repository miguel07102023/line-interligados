<style>

.auth-logo{display:flex;align-items:center;gap:13px}.logo-box{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#2f6aa3,#123a6d);box-shadow:0 12px 32px rgba(23,74,122,.35)}

.auth-copy h1{font-size:48px;line-height:1.04;letter-spacing:-2px;margin-bottom:18px}.auth-copy p{font-size:15px;line-height:1.7;color:#aab8cb;max-width:520px}
.auth-features{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.auth-chip{border:1px solid rgba(255,255,255,.08);background:rgba(7,13,24,.34);padding:10px 13px;border-radius:12px;font-size:11px;color:#d7deea;display:flex;align-items:center;gap:7px}
.auth-panel{display:grid;place-items:center;padding:20px}.auth-card{width:min(440px,100%);background:rgba(11,19,33,.94);border:1px solid var(--border);border-radius:24px;padding:30px;box-shadow:var(--shadow)}
.auth-card h2{font-size:25px;margin-bottom:6px}.auth-card>p{font-size:12px;color:var(--muted);margin-bottom:22px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:#08111e;border-radius:11px;padding:4px;margin-bottom:20px}.auth-tab{border:0;background:transparent;color:#8fa0b6;padding:10px;border-radius:8px;font-size:12px;font-weight:600}.auth-tab.active{background:#162237;color:#fff}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:13px}.field label{font-size:11px;color:#b7c2d3}.field input,.field select,.field textarea{width:100%;background:#08111e;color:#fff;border:1px solid var(--border);outline:0;border-radius:11px;padding:12px 13px}.field input:focus,.field select:focus{border-color:rgba(30,79,138,.5);box-shadow:0 0 0 3px rgba(30,79,138,.08)}

.auth-submit{width:100%;margin-top:5px}.helper{margin-top:14px;color:#718198;font-size:10px;line-height:1.5}

.shell{display:flex;min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);background:linear-gradient(180deg,#07101c,#050c16);border-right:1px solid var(--border);padding:20px 15px;display:flex;flex-direction:column;z-index:30}
.brand{display:flex;align-items:center;gap:12px;padding:8px 9px 26px}.brand .logo-box{width:42px;height:42px}.brand strong{font-size:23px;letter-spacing:1px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:5px}.nav a{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:11px;color:#b9c5d5;font-size:13px;font-weight:500;transition:.18s}.nav a:hover{background:rgba(255,255,255,.035);color:#fff}.nav a.active{background:linear-gradient(90deg,rgba(23,74,122,.40),rgba(16,52,98,.22));border:1px solid rgba(30,79,138,.14);color:#fff}.nav a.active svg{color:#b9d4ee}.nav-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:#174a7a;display:grid;place-items:center;font-size:10px;font-weight:800}
.sidebar-bottom{margin-top:auto}.user-card{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.02)}.avatar{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:linear-gradient(145deg,#293447,#101827);border:2px solid rgba(255,255,255,.10)}.user-card b{font-size:12px}.user-card small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.online{font-size:9px;color:#b7c2d3;margin-top:4px}.online:before{content:"";display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:5px}.logout{width:100%;display:flex;align-items:center;gap:10px;margin-top:10px;padding:12px;border:0;border-radius:11px;background:#111b2b;color:#fff;font-weight:600}
.main{margin-left:var(--sidebar-w);width:calc(100% - var(--sidebar-w));padding:24px 26px 90px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:24px}.welcome h1{font-size:28px;letter-spacing:-1px;margin-bottom:6px}.welcome p{font-size:12px;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:10px}.search{width:250px;height:42px;background:#0b1524;border:1px solid var(--border);border-radius:11px;display:flex;align-items:center;padding:0 12px;gap:8px}.search input{background:transparent;border:0;outline:0;color:#fff;flex:1;font-size:12px}.icon-btn{width:42px;height:42px;border-radius:11px;border:1px solid var(--border);background:#0b1524;color:#fff;display:grid;place-items:center}.top-user{display:flex;align-items:center;gap:9px}.top-user b{font-size:12px}.top-user small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.page-toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px}.page-title h2{font-size:21px;margin-bottom:5px}.page-title p{font-size:11px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.stat{padding:17px;border-radius:16px;border:1px solid var(--border);min-height:112px;display:flex;align-items:flex-start;gap:13px;box-shadow:var(--shadow)}.stat.purple{background:linear-gradient(135deg,rgba(16,52,98,.38),rgba(27,18,67,.92))}.stat.blue{background:linear-gradient(135deg,rgba(30,64,175,.42),rgba(6,29,64,.95))}.stat.yellow{background:linear-gradient(135deg,rgba(146,88,8,.40),rgba(64,35,5,.95))}.stat.green{background:linear-gradient(135deg,rgba(22,101,52,.42),rgba(6,54,35,.95))}.stat-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.10)}.stat label{font-size:11px;color:#dce5f1}.stat strong{display:block;font-size:25px;margin-top:3px}.stat small{display:block;margin-top:7px;font-size:9px;color:#aeb9ca}
.dash-grid{display:grid;grid-template-columns:1.04fr .96fr;gap:14px;margin-bottom:14px}.panel{background:linear-gradient(180deg,rgba(15,24,39,.96),rgba(10,18,31,.96));border:1px solid var(--border);border-radius:17px;padding:15px;box-shadow:var(--shadow)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.panel-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}.panel-title svg{color:#8fb8dc}.ghost-btn{border:0;border-radius:9px;padding:8px 10px;background:rgba(16,52,98,.34);color:#fff;font-size:10px}
.event-hero{display:grid;grid-template-columns:150px 1fr;gap:14px}.cover{min-height:145px;border-radius:13px;padding:14px;background:radial-gradient(circle at 70% 20%,rgba(245,158,11,.28),transparent 30%),linear-gradient(145deg,#452909,#1c1308);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.cover span{font-size:36px}.cover b{font-size:20px;line-height:1;text-transform:uppercase;color:#f7d69a}.event-info h3{font-size:19px;margin-bottom:8px}.status{display:inline-flex;align-items:center;padding:5px 8px;border-radius:99px;font-size:9px;font-weight:700}.green{background:rgba(34,197,94,.14);color:#4ade80}.yellow{background:rgba(245,158,11,.14);color:#fbbf24}.purple-tag{background:rgba(30,79,138,.17);color:#b9d4ee}.gray{background:rgba(148,163,184,.12);color:#cbd5e1}.info{display:flex;align-items:center;gap:7px;font-size:10px;color:#c7d1df;margin:8px 0}.info svg{width:14px;height:14px}

.schedule{margin-top:13px;border-radius:12px;overflow:hidden;background:#101a2b}.schedule-row{display:grid;grid-template-columns:1fr 1.1fr auto;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid rgba(255,255,255,.045);font-size:10px}.role,.person{display:flex;align-items:center;gap:7px}.mini{width:25px;height:25px;border-radius:7px;display:grid;place-items:center}.mini.purple{background:#123a6d}.mini.orange{background:#f59e0b}.mini.pink{background:#ec4899}.person .avatar{width:25px;height:25px;font-size:9px}.check{width:18px;height:18px;border-radius:50%;background:rgba(34,197,94,.14);color:#4ade80;display:grid;place-items:center}
.upcoming{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}.date-box{width:52px;height:52px;border-radius:11px;background:#08111e;display:grid;place-items:center;text-align:center}.date-box b{display:block;color:#2f6aa3;font-size:20px}.date-box small{font-size:9px;color:#cbd5e1}.upcoming h4{font-size:11px;margin-bottom:5px}.upcoming p{font-size:9px;color:var(--muted)}
.bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.activity{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.045)}.act-icon{width:20px;height:20px;border-radius:50%;display:grid;place-items:center}.act-icon.ok{background:#22c55e}.act-icon.wait{border:2px solid #f59e0b;color:#fbbf24}.activity p{font-size:10px}.activity small{font-size:9px;color:#6f8199}
.indicators{display:grid;grid-template-columns:140px 1fr;align-items:center;min-height:135px}.donut{width:105px;height:105px;border-radius:50%;margin:auto;position:relative;background:conic-gradient(#22c55e 0 67%,#f59e0b 67% 84%,#ef4444 84%)}.donut:after{content:"";position:absolute;inset:14px;border-radius:50%;background:#0c1625}.donut-copy{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center}.donut-copy strong{font-size:17px}.donut-copy small{font-size:8px;color:#aab8c9}.legend{display:flex;flex-direction:column;gap:11px}.legend-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-size:10px}.swatch{width:12px;height:12px;border-radius:4px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:13px 11px;text-align:left;border-bottom:1px solid rgba(255,255,255,.05);font-size:10px}.table th{font-size:9px;color:#88a0bc;text-transform:uppercase;letter-spacing:.04em}.member-cell{display:flex;align-items:center;gap:8px}.member-cell .avatar{width:29px;height:29px;font-size:9px}.action-btn{border:0;border-radius:8px;background:#142033;color:#d9e2ef;padding:7px 9px;font-size:9px}
.calendar-shell{display:grid;grid-template-columns:1fr 260px;gap:14px}.calendar-panel{padding:15px}.calendar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.calendar-header h3{font-size:16px}.cal-nav{display:flex;gap:7px}.cal-nav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:#0a1422;color:#fff;display:grid;place-items:center}.weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays div{text-align:center;color:#7890ad;font-size:9px;font-weight:700;padding:8px}.day{min-height:105px;border-top:1px solid rgba(255,255,255,.05);border-right:1px solid rgba(255,255,255,.04);padding:8px;position:relative;transition:.15s}.day:hover{background:rgba(255,255,255,.018)}.day.muted{opacity:.34}.day.today .day-num{background:#174a7a;color:#fff}.day-num{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:700}.cal-event{margin-top:6px;padding:6px 7px;border-radius:7px;font-size:8px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cal-event.purple{background:rgba(30,79,138,.17);color:#d8ccff;border-left:2px solid #1e4f8a}.cal-event.blue{background:rgba(59,130,246,.14);color:#bfdbfe;border-left:2px solid #3b82f6}.cal-event.yellow{background:rgba(245,158,11,.12);color:#fde68a;border-left:2px solid #f59e0b}.cal-side h3{font-size:13px;margin-bottom:12px}.side-event{padding:11px;border:1px solid rgba(255,255,255,.05);border-radius:11px;background:#0a1422;margin-bottom:9px}.side-event b{font-size:10px}.side-event p{font-size:9px;color:var(--muted);margin-top:5px}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.settings-section h3{font-size:13px;margin-bottom:12px}.setting-line{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}.setting-line b{font-size:10px}.setting-line small{display:block;color:var(--muted);font-size:9px;margin-top:4px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:20px;z-index:100}.modal{width:min(560px,100%);background:#0c1625;border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.modal h3{font-size:16px;margin-bottom:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.secondary{border:0;background:#162236;color:#dce5f0;border-radius:10px;padding:10px 12px;font-size:10px}
.mobile-nav{display:none}

@media(max-width:760px){
 .auth-page{grid-template-columns:1fr;padding:14px}.auth-art{display:none}.auth-panel{padding:0}.auth-card{margin-top:5vh}
 .sidebar{display:none}.main{margin-left:0;width:100%;padding:18px 13px 82px}.search,.top-user>div:last-child{display:none}.welcome h1{font-size:23px}
 .stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{min-height:102px;padding:13px}.stat-icon{width:38px;height:38px}.stat strong{font-size:22px}
 .event-hero{grid-template-columns:105px 1fr}.cover{min-height:120px}.cover b{font-size:15px}.cover span{font-size:29px}
 .upcoming{grid-template-columns:50px 1fr}.upcoming>.status{display:none}.bottom-grid{grid-template-columns:1fr}.indicators{grid-template-columns:1fr}
 .calendar-shell{grid-template-columns:1fr}.calendar-panel{padding:10px}.day{min-height:73px;padding:5px}.cal-event{font-size:7px;padding:4px}.calendar-side{display:none}
 .profile-grid{grid-template-columns:1fr}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;height:66px;background:rgba(5,12,22,.97);border-top:1px solid var(--border);z-index:40}.mobile-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#7f8fa6;font-size:8px}.mobile-nav a.active{color:#8fb8dc}
 .form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}
}

.notification-popover{
 position:fixed;top:72px;right:96px;width:min(360px,calc(100vw - 28px));z-index:95;
 background:#0c1625;border:1px solid var(--border);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.38);
 overflow:hidden
}

.notification-popover-head b{font-size:12px}.notification-popover-head small{font-size:9px;color:var(--muted)}

/* ===== V8.2 — MODAIS RESPONSIVOS ===== */
.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:flex !important;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
  overflow-y:auto;
  overscroll-behavior:contain;
}

.modal{
  width:min(620px,100%);
  max-height:calc(100vh - 40px);
  max-height:calc(100dvh - 40px);
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  background:#0c1625;
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  box-shadow:var(--shadow);
}

.modal::-webkit-scrollbar{
  width:6px;
}
.modal::-webkit-scrollbar-track{
  background:transparent;
}
.modal::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.12);
  border-radius:999px;
}

.profile-popover .modal{
  width:min(620px,100%);
}

@media(max-width:760px){
  .modal-bg{
    align-items:flex-start;
    padding:12px;
  }

  .modal{
    width:100%;
    max-width:none;
    max-height:calc(100vh - 24px);
    max-height:calc(100dvh - 24px);
    border-radius:16px;
    padding:16px;
    margin:0;
  }

  .profile-header{
    position:sticky;
    top:-16px;
    z-index:3;
    background:#0c1625;
    padding-top:16px;
    padding-bottom:12px;
    margin-bottom:10px;
  }

  .form-grid{
    grid-template-columns:1fr !important;
  }

  .field.full{
    grid-column:auto !important;
  }

  .modal-actions{
    position:sticky;
    bottom:-16px;
    z-index:4;
    background:#0c1625;
    margin-top:12px;
    padding-top:12px;
    padding-bottom:16px;
    box-shadow:0 -12px 18px rgba(6,11,19,.78);
  }

  .modal-actions .primary,
  .modal-actions .secondary,
  .modal-actions .danger-btn{
    min-height:42px;
  }

  .profile-header .profile-photo{
    width:58px;
    height:58px;
  }
}

@media(max-width:420px){
  .modal-bg{padding:8px}
  .modal{
    max-height:calc(100dvh - 16px);
    border-radius:14px;
    padding:14px;
  }
  .profile-header{
    top:-14px;
    padding-top:14px;
  }
  .modal-actions{
    bottom:-14px;
    padding-bottom:14px;
    gap:7px;
    flex-wrap:wrap;
  }
  .modal-actions button{
    flex:1 1 120px;
  }
}

/* ==========================================================

   ========================================================== */

html[data-theme="light"]{
  --bg:#eef3f8;
  --surface:#ffffff;
  --surface-2:#f5f8fb;
  --surface-3:#edf4fa;
  --text:#0b1520;
  --muted:#516273;
  --muted-2:#708192;
  --border:#dce6ef;
  --border-strong:#c9d7e4;
  --navy:#0d2944;
  --navy-2:#153b5d;
  --blue-soft:#e8f3fb;
  --shadow:0 10px 28px rgba(31,59,82,.08);
}

/* Base */
html[data-theme="light"] body,
html[data-theme="light"] .app,
html[data-theme="light"] .main{
  background:var(--bg)!important;
  color:var(--text)!important;
}

html[data-theme="light"] :is(
  h1,h2,h3,h4,h5,h6,strong,b,
  .panel-title,.page-title,.welcome h1,
  .team-card h3,.task-card h4,.upcoming h4,
  .member-name,.profile-name,.modal-title
){
  color:var(--text)!important;
}

html[data-theme="light"] :is(
  p,small,label,.muted,.welcome p,
  .team-card>p,.task-card p,.upcoming p,
  .calendar-first-subtitle,.interactive-hint,
  .member-role,.profile-meta,.modal-subtitle
){
  color:var(--muted)!important;
}

html[data-theme="light"] .sidebar{

}

  color:#0d2944!important;
}

html[data-theme="light"] .sidebar .active{

}

html[data-theme="light"] .topbar svg{
  color:#25445f!important;
}

/* Cards e painéis */
html[data-theme="light"] :is(
  .panel,.stat,.team-card,.task-card,.kanban-col,
  .profile-card,.event-card,.schedule-card,
  .notification-card,.settings-card,.calendar-card,
  .dashboard-clickable,.home-modal-kpi
){
  background:var(--surface)!important;
  border-color:var(--border)!important;
  color:var(--text)!important;
  box-shadow:var(--shadow)!important;

html[data-theme="light"] :is(
  .panel:hover,.stat:hover,.team-card:hover,.task-card:hover,

/* ==========================================================
   V10.8 — AVATAR PADRÃO PARA PERFIS SEM FOTO
   ========================================================== */
.avatar-fallback,
.avatar.avatar-fallback,
.profile-photo.avatar-fallback,
.avatar-preview.avatar-fallback{
  display:grid!important;
  place-items:center!important;
  overflow:hidden!important;
  flex:none!important;
  border-radius:50%!important;
  background:
    radial-gradient(circle at 30% 24%,rgba(255,255,255,.16),transparent 34%),
    linear-gradient(145deg,#173f63,#0b2238)!important;
  border:1px solid rgba(117,188,239,.28)!important;
  color:#f4faff!important;
  font-weight:800!important;
  letter-spacing:.035em!important;
  text-transform:uppercase!important;
  text-shadow:0 1px 2px rgba(0,0,0,.32)!important;
  box-shadow:
    0 5px 14px rgba(0,0,0,.20),
    inset 0 1px 0 rgba(255,255,255,.10)!important;
  user-select:none!important;
}

.avatar-fallback::after{
  content:"";
  position:absolute;
  inset:2px;
  border-radius:inherit;
  border:1px solid rgba(255,255,255,.035);
  pointer-events:none;
}

.avatar-fallback{
  position:relative!important;
}

/* Foto real ocupa perfeitamente o avatar */
.has-photo{
  overflow:hidden!important;
  color:transparent!important;
}

.has-photo img{
  width:100%!important;
  height:100%!important;
  object-fit:cover!important;
  object-position:center!important;
  display:block!important;
  border-radius:inherit!important;
}

/* Tamanhos e legibilidade */
.team-member .avatar-fallback,
.member-cell .avatar-fallback{
  font-size:9px!important;
}

.top-user .avatar-fallback,
.user-card .avatar-fallback{
  font-size:10px!important;
}

.profile-photo.avatar-fallback,
.avatar-preview.avatar-fallback{
  font-size:20px!important;
}

/* Modo claro: avatar continua forte, mas harmoniza com os cards claros */
html[data-theme="light"] .avatar-fallback,
html[data-theme="light"] .avatar.avatar-fallback,
html[data-theme="light"] .profile-photo.avatar-fallback,
html[data-theme="light"] .avatar-preview.avatar-fallback{
  background:
    radial-gradient(circle at 30% 24%,rgba(255,255,255,.78),transparent 35%),
    linear-gradient(145deg,#dcecf8,#b9d5e8)!important;
  border-color:#a9c9df!important;
  color:#123650!important;
  text-shadow:none!important;
  box-shadow:
    0 4px 11px rgba(31,69,98,.13),
    inset 0 1px 0 rgba(255,255,255,.85)!important;
}

/* Linha de membro sem foto: evita aparência espremida */
.team-member{
  align-items:center!important;
}

.team-member .avatar{
  flex:0 0 auto!important;
}

.team-member>span{
  min-width:0!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
  white-space:nowrap!important;
  line-height:1.3!important;
}

/* Mobile: avatar um pouco maior e nome mais legível */
@media(max-width:760px){
  .team-member .avatar,
  .member-cell .avatar{
    width:36px!important;
    height:36px!important;
    min-width:36px!important;
  }

  .team-member .avatar-fallback,
  .member-cell .avatar-fallback{
    font-size:10px!important;
  }

  .team-member{
    min-height:58px!important;
    gap:11px!important;
    padding:10px 11px!important;
  }

  .team-member>span{
    font-size:9px!important;
  }
}

/* ==========================================================
   V11.2 — CORREÇÃO DEFINITIVA DE CLIQUES E MODAIS
   ========================================================== */
body.modal-open{
  overflow:hidden!important;
}

.modal-bg.active-modal{
  position:fixed!important;
  inset:0!important;
  z-index:99999!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  padding:18px!important;
  background:rgba(2,8,15,.72)!important;
  backdrop-filter:blur(10px)!important;
  -webkit-backdrop-filter:blur(10px)!important;
  opacity:0;
  transition:opacity .12s ease;
  pointer-events:auto!important;
}

.modal-bg.active-modal.is-visible{
  opacity:1;
}

.modal-bg.active-modal .modal{
  position:relative!important;
  z-index:100000!important;
  width:min(720px,100%)!important;
  max-height:calc(100dvh - 36px)!important;
  overflow-y:auto!important;
  overscroll-behavior:contain!important;
  pointer-events:auto!important;
  transform:translateY(8px) scale(.99);
  transition:transform .14s ease;
}

.modal-bg.active-modal.is-visible .modal{
  transform:translateY(0) scale(1);
}

[data-application-open],
[data-event-open]{
  cursor:pointer!important;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation!important;
}

[data-application-open] button,
[data-event-open] button{
  pointer-events:auto!important;
}

.application-actions button,
.event-table-row button,
.modal button,
.modal a{
  position:relative!important;
  z-index:2!important;
  pointer-events:auto!important;
}

.event-table-row:focus-visible,
.application-card:focus-visible{
  outline:2px solid #65b6ed!important;
  outline-offset:3px!important;
}

  background:rgba(20,39,55,.48)!important;
}

@media(max-width:760px){
  .modal-bg.active-modal{
    align-items:flex-end!important;
    padding:10px!important;
  }

  .modal-bg.active-modal .modal{
    width:100%!important;
    max-height:92dvh!important;
    border-radius:25px 25px 18px 18px!important;
    padding:18px!important;
  }

  [data-application-open],

  }
}

/* ==========================================================
   LINE v12 — BOARDS

.line-board-shell{margin-top:12px}

.kanban-board-v12{

}
.kanban-card-list-v12{display:flex;flex-direction:column;gap:8px;min-height:12px}
.task-card-v12{

  cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.13);transition:.14s ease
}
.task-card-v12:hover{transform:translateY(-1px);border-color:rgba(79,163,225,.38)}
.task-card-v12.dragging{opacity:.45;transform:rotate(1deg)}
.task-cover-v12{height:88px;background-size:cover;background-position:center}
.task-cover-color-v12{height:8px}
.task-card-body-v12{padding:10px}
.task-labels-v12{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.task-label-v12{height:7px;min-width:34px;border-radius:999px}
.task-card-v12 h4{font-size:9px;line-height:1.35;margin:0 0 7px;color:var(--text)}
.task-card-meta-v12{display:flex;align-items:center;justify-content:space-between;gap:7px;color:var(--muted)}
.task-meta-left-v12{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.task-mini-meta{display:flex;align-items:center;gap:3px;font-size:6.5px}
.task-mini-meta svg{width:11px;height:11px}
.task-due-overdue{color:#ff7878!important;font-weight:800}
.task-assignee-stack{display:flex;justify-content:flex-end}
.task-assignee-stack .avatar{width:25px!important;height:25px!important;min-width:25px!important;margin-left:-6px;border:2px solid #0d1c2b;font-size:6px!important}
.task-add-v12{

  border-radius:9px;padding:8px 7px;font-size:8px;font-weight:800
}
.task-add-v12:hover{background:#102235;color:#eaf6ff}

.board-empty-v12{font-size:7.5px;color:var(--muted);padding:9px 5px}
.board-archive-btn{margin-left:auto}

.task-modal-v12{max-width:920px!important;width:min(920px,94vw)!important}
.task-modal-grid-v12{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(230px,.7fr);gap:17px}
.task-detail-section{margin:0 0 16px}
.task-detail-section h4{font-size:9px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.task-detail-section h4 svg{width:14px;height:14px}
.task-sidebar-v12{display:flex;flex-direction:column;gap:8px}
.task-side-button{
  width:100%;display:flex;align-items:center;gap:7px;border:1px solid var(--border);

}
.task-side-button svg{width:13px;height:13px}
.task-description-box{

  font-size:8px;line-height:1.55;color:#c6d7e5;white-space:pre-wrap
}
.task-description-box.clickable:hover{border-color:#3f7ba8}

.task-members-v12{display:flex;gap:6px;flex-wrap:wrap}
.task-member-pill{
  display:flex;align-items:center;gap:6px;background:#0c1a28;border:1px solid var(--border);
  padding:5px 8px 5px 5px;border-radius:999px;font-size:7px
}
.task-member-pill .avatar{width:25px!important;height:25px!important;min-width:25px!important;font-size:6px!important}

.checklist-head-v12{display:flex;justify-content:space-between;align-items:center;gap:8px}
.checklist-progress-track{height:7px;background:#0a1622;border-radius:999px;overflow:hidden;margin:8px 0}
.checklist-progress-track span{height:100%;display:block;background:#39a56c;border-radius:999px}
.check-item-v12{display:flex;align-items:flex-start;gap:8px;padding:7px 3px}
.check-item-v12 input{width:15px!important;height:15px!important;min-height:0!important;margin-top:1px}
.check-item-v12.done span{text-decoration:line-through;color:var(--muted)}
.check-item-v12 span{font-size:8px;line-height:1.4;flex:1}
.check-item-delete{border:0;background:transparent;color:#7991a5;padding:1px}
.check-item-delete svg{width:12px;height:12px}

.comment-list-v12{display:flex;flex-direction:column;gap:9px}
.comment-v12{display:flex;gap:8px}
.comment-v12 .avatar{width:29px!important;height:29px!important;min-width:29px!important;font-size:6px!important}
.comment-bubble-v12{background:#0c1a28;border:1px solid var(--border);border-radius:11px;padding:8px 9px;flex:1}
.comment-bubble-v12 b{font-size:7.5px}
.comment-bubble-v12 small{font-size:6px;color:var(--muted);margin-left:5px}
.comment-bubble-v12 p{font-size:8px;line-height:1.45;margin:5px 0 0;white-space:pre-wrap}
.comment-form-v12{display:flex;gap:7px;margin-top:9px}
.comment-form-v12 textarea{min-height:55px!important;flex:1}
.mention-help{font-size:6.5px;color:var(--muted);margin-top:4px}

.attachment-grid-v12{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.attachment-item-v12{
  border:1px solid var(--border);background:#0b1825;border-radius:11px;padding:8px;display:flex;align-items:center;gap:8px
}
.attachment-item-v12 img{width:48px;height:42px;object-fit:cover;border-radius:7px}
.attachment-item-v12 .attachment-icon{width:38px;height:38px;border-radius:8px;background:#112942;display:grid;place-items:center}
.attachment-item-v12 .attachment-icon svg{width:15px;height:15px}
.attachment-item-v12 div{min-width:0}
.attachment-item-v12 b{font-size:7px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attachment-item-v12 a{font-size:6.5px;color:#80bce7}

.activity-list-v12{display:flex;flex-direction:column;gap:7px}
.activity-v12{font-size:7px;color:var(--muted);display:flex;gap:6px;line-height:1.4}
.activity-v12 b{color:var(--text)}

.label-picker-v12{display:flex;flex-direction:column;gap:6px}
.label-option-v12{display:flex;align-items:center;gap:7px}
.label-color-v12{width:32px;height:24px;border-radius:6px}
.label-option-v12 span{font-size:8px;flex:1}

.board-table-v12{width:100%;border-collapse:separate;border-spacing:0 6px}
.board-table-v12 th{font-size:7px;color:var(--muted);text-align:left;padding:0 8px 4px}
.board-table-v12 td{background:#0b1825;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:9px 8px;font-size:7.5px}
.board-table-v12 td:first-child{border-left:1px solid var(--border);border-radius:10px 0 0 10px}
.board-table-v12 td:last-child{border-right:1px solid var(--border);border-radius:0 10px 10px 0}

.board-calendar-v12{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.board-calendar-day{min-height:115px;background:#0a1622;border:1px solid var(--border);border-radius:12px;padding:7px}
.board-calendar-day>strong{font-size:7px;color:var(--muted)}
.board-calendar-task{margin-top:5px;background:#10253a;border-radius:6px;padding:5px;font-size:6.5px;cursor:pointer}
.board-calendar-empty{opacity:.35}

.timeline-v12{display:flex;flex-direction:column;gap:8px}

.timeline-name-v12{font-size:7.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timeline-track-v12{height:32px;background:#0a1622;border:1px solid var(--border);border-radius:9px;position:relative;overflow:hidden}
.timeline-bar-v12{position:absolute;top:6px;height:18px;min-width:12px;border-radius:6px;background:#245f8e;color:white;font-size:6px;padding:3px 5px;white-space:nowrap;overflow:hidden}

.board-dashboard-v12{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}

.board-status-bar{height:7px;background:#07111b;border-radius:99px;overflow:hidden}
.board-status-bar span{display:block;height:100%;background:#2b78ae}

.archive-list-v12{display:flex;flex-direction:column;gap:7px}
.archive-item-v12{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--border);background:#0b1825;border-radius:10px;padding:9px}
.archive-item-v12 b{font-size:8px}.archive-item-v12 small{font-size:6.5px;color:var(--muted)}

html[data-theme="light"] .board-view-tabs button,
html[data-theme="light"] .board-filter-row button,
html[data-theme="light"] .kanban-col-v12,
html[data-theme="light"] .task-card-v12,

html[data-theme="light"] .task-side-button,
html[data-theme="light"] .task-member-pill,
html[data-theme="light"] .comment-bubble-v12,

.sidebar .nav a::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(110deg,transparent 20%,rgba(85,185,255,.10) 48%,transparent 76%);
  transform:translateX(-135%);
  transition:transform .45s ease;
  pointer-events:none;

/* ==========================================================
   LINE v14.0 — APP REDESIGN
   Referência: layout mobile clean / cards / native-app feel
   ========================================================== */

:root{
  --v14-blue:#1677ff;
  --v14-blue-2:#0b63e6;
  --v14-bg:#f5f7fa;
  --v14-card:#ffffff;
  --v14-text:#0b1520;
  --v14-muted:#667085;
  --v14-line:rgba(11,21,32,.075);
  --v14-shadow:0 12px 34px rgba(16,24,40,.065);
  --v14-radius:22px;
}
html[data-theme="light"]{
  --bg:#f5f7fa!important;
  --panel:#ffffff!important;
  --panel2:#ffffff!important;
  --card:#ffffff!important;
  --text:#0b1520!important;
  --muted:#667085!important;
  --border:rgba(11,21,32,.075)!important;
}
html[data-theme="dark"]{
  --bg:#050b12!important;
  --panel:#0c1621!important;
  --panel2:#0c1621!important;
  --card:#0c1621!important;
  --text:#f7fafc!important;
  --muted:#98a2b3!important;
  --border:rgba(255,255,255,.075)!important;
}

body{
  background:var(--bg)!important;
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;
  letter-spacing:-.012em;
}
.shell{background:var(--bg)!important}
.main{
  background:var(--bg)!important;
  padding-bottom:36px!important;
}
.main>*:not(.topbar){
  max-width:1200px;
  margin-left:auto;
  margin-right:auto;
}

/* ---------- desktop sidebar ---------- */
.sidebar{
  background:color-mix(in srgb,var(--panel) 96%,transparent)!important;
  border-right:1px solid var(--border)!important;
  box-shadow:none!important;
}
.brand{padding:24px 18px 17px!important}
.logo-box.generic-line-logo{
  border-radius:15px!important;
  background:var(--v14-blue)!important;
  box-shadow:none!important;
}
.nav{padding:8px 12px!important;gap:5px!important}
.nav a{
  min-height:48px!important;

  border:0!important;
  color:var(--muted)!important;
  transition:background .2s ease,color .2s ease,transform .2s ease!important;
}
.nav a:hover{background:color-mix(in srgb,var(--v14-blue) 7%,transparent)!important;transform:translateX(2px)}
.nav a.active{

  color:var(--v14-blue)!important;
  box-shadow:none!important;
}
.nav a.active svg{color:var(--v14-blue)!important}
.sidebar-bottom{padding:12px!important}
.user-card,.logout{
  border-radius:16px!important;
  border:1px solid var(--border)!important;
  background:var(--panel)!important;
  box-shadow:none!important;
}

/* ---------- top header ---------- */
.topbar{
  min-height:88px!important;
  padding:18px 24px!important;
  background:color-mix(in srgb,var(--bg) 92%,transparent)!important;
  backdrop-filter:blur(18px);

  border-bottom:0!important;
  position:sticky!important;
  top:0!important;
  z-index:90!important;
}
.welcome h1{
  font-size:28px!important;
  font-weight:800!important;
  letter-spacing:-.045em!important;
}
.welcome p{font-size:13px!important;color:var(--muted)!important}
.top-actions{gap:10px!important}
.icon-btn,.theme-pill,.search,.top-user{
  border-radius:16px!important;
  border:1px solid var(--border)!important;
  background:var(--panel)!important;
  box-shadow:none!important;
}
.icon-btn{width:46px!important;height:46px!important}
.top-user{padding:5px 9px 5px 6px!important}

/* ---------- universal cards ---------- */
.panel,.stat,.team-card,.schedule-card,.manual-card-v121,.application-card,.ai-form-card,
.availability-management-panel,.event-card-v14,.line-event-card-v14,.member-next-card-v14,
.master-next-card-v14,.v14-mini-stat,.v14-section-card{

.panel{

}
.panel-head{

}
.panel-title{

}
.page-toolbar{

}
.page-title h2{

  letter-spacing:-.045em!important;

.page-title p{

}
.primary,.action-btn,.ghost-btn,.secondary{

.primary{

}
.primary:hover{background:var(--v14-blue-2)!important;transform:translateY(-1px)}
.action-btn,.ghost-btn,.secondary{

/* ---------- new app typography ---------- */
.v14-app-intro{margin:6px 0 17px}

/* ---------- reference-style event card ---------- */

.v14-card-actions button{width:100%;min-height:46px;border-radius:12px;font-weight:760}

async function setMemberTeams(userId,teamIds){
  const ids=[...new Set((teamIds||[]).map(Number).filter(Boolean))];
  const own=String(userId)===String(currentUser?.id);

  if(!isMaster() && !own){
    alert("Você só pode alterar as suas próprias equipes.");
    return false;
  }

  if(!isMaster() && ids.length>2){
    alert("Você pode participar de no máximo 2 equipes.");
    return false;
  }

  if(!ids.length){
    alert("Escolha pelo menos 1 equipe.");
    return false;
  }

  // Para o próprio membro usamos RPC para funcionar mesmo com RLS restritiva.
  if(own && !isMaster()){
    const {error}=await supabaseClient.rpc("set_my_teams",{p_team_ids:ids});
    if(error){
      console.error(error);
      alert("Não foi possível salvar suas equipes.");
      return false;
    }
    return true;
  }

  // Master pode atribuir quantas equipes forem necessárias.
  const {error:rpcError}=await supabaseClient.rpc("master_set_member_teams",{
    p_user_id:userId,
    p_team_ids:ids
  });

  if(!rpcError)return true;

  console.warn("RPC master_set_member_teams falhou; tentando acesso direto.",rpcError);

  const {error:delError}=await supabaseClient
    .from("member_teams")
    .delete()
    .eq("user_id",userId);

  if(delError){
    console.error(delError);
    alert("Não foi possível atualizar as equipes.");
    return false;
  }

  const {error:insError}=await supabaseClient
    .from("member_teams")
    .insert(ids.map(team_id=>({user_id:userId,team_id})));

  if(insError){
    console.error(insError);
    alert("Não foi possível salvar as equipes selecionadas.");
    return false;
  }

  return true;
}

async function uploadAvatarFile(file){
  if(!file || !currentUser)return null;

  if(!file.type || !file.type.startsWith("image/")){
    alert("Selecione um arquivo de imagem.");
    return null;
  }

  const maxSize=5*1024*1024;
  if(file.size>maxSize){
    alert("A foto deve ter no máximo 5 MB.");
    return null;
  }

  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=`${currentUser.id}/avatar-${Date.now()}.${ext||"jpg"}`;

  const {data:uploadData,error:uploadError}=await supabaseClient
    .storage
    .from("avatars")
    .upload(path,file,{
      cacheControl:"3600",
      contentType:file.type,
      upsert:false
    });

  if(uploadError){
    console.error("Erro no upload do avatar:",uploadError);
    alert(`Não foi possível enviar a foto: ${uploadError.message||"erro no Storage"}`);
    return null;
  }

  const storedPath=uploadData?.path||path;
  const {data:publicData}=supabaseClient.storage.from("avatars").getPublicUrl(storedPath);

  if(!publicData?.publicUrl){
    alert("A foto foi enviada, mas não foi possível gerar a URL pública.");
    return null;
  }

  return `${publicData.publicUrl}?v=${Date.now()}`;
}

   return null;
 }

 if(!profile){
   console.warn("Perfil não encontrado para o usuário autenticado.");
   currentUser=null;
   return null;
 }

 let serverIsMaster=false;
 try{
   const {data:masterCheck,error:masterCheckError}=await supabaseClient.rpc("line_is_master");
   if(!masterCheckError)serverIsMaster=masterCheck===true;
 }catch(error){
   console.warn("Não foi possível validar permissão Master via RPC:",error);
 }

 const normalizedRole=String(profile.role||"").trim().toLowerCase();
 currentUser={
   ...profile,
   role:serverIsMaster||normalizedRole==="master"?"master":normalizedRole,
   is_master:serverIsMaster||normalizedRole==="master",
   photo:profile.photo_url||"",
   area:user.user_metadata?.area||profile.leadership_role||((serverIsMaster||normalizedRole==="master")?"Administração":"Membro"),
   functions:[],
   schedules:0,
   status:profile.active===false?"Inativo":"Ativo"
 };
 return currentUser;
}


window.syncMyTeamsFromSignupMetadata=async function(){
  if(!authUser || !currentUser || currentUser.role==="master")return;

  const requested=Array.isArray(authUser.user_metadata?.selected_teams)
    ?authUser.user_metadata.selected_teams.slice(0,2)
    :[];

  if(!requested.length)return;

  const {data:existing,error:existingError}=await supabaseClient
    .from("member_teams")
    .select("team_id")
    .eq("user_id",currentUser.id);

  if(existingError){
    console.warn("Não foi possível conferir equipes atuais:",existingError);
    return;
  }
  if((existing||[]).length)return;

  const {data:teams,error:teamsError}=await supabaseClient
    .from("teams")
    .select("id,name")
    .in("name",requested);

  if(teamsError){
    console.warn("Não foi possível localizar equipes escolhidas:",teamsError);
    return;
  }

  if(teams?.length){
    const {error}=await supabaseClient.rpc("set_my_teams",{
      p_team_ids:teams.map(t=>Number(t.id))
    });
    if(error)console.warn("Não foi possível sincronizar equipes iniciais:",error);
  }
};

function withTimeout(promise,ms=7000){
 return Promise.race([
   promise,
   new Promise((_,reject)=>setTimeout(()=>reject(new Error("TIMEOUT")),ms))
 ]);
}

async function initializeApp(){
 // Renderiza uma interface imediatamente, sem segurar a tela em loading.
 document.getElementById("app").innerHTML=authPage();
 refreshIcons();

 try{
   const {data:{session},error}=await withTimeout(supabaseClient.auth.getSession(),5000);
   if(error)console.error("Erro ao recuperar sessão:",error);

   if(session?.user){
     authUser=session.user;

     if(location.hash==="#reset-password"){
       showNewPasswordScreen();
       return;
     }

     showAppLoading("Carregando seu perfil...");
     await withTimeout(loadCurrentUser(session.user),7000);
   }else{
     currentUser=null;
     authUser=null;
   }
 }catch(error){
   console.error("Inicialização do Supabase:",error);
   currentUser=null;
   authUser=null;
 }

 render();
}

// IMPORTANTE: não fazemos await de chamadas Supabase dentro do callback.
// Isso evita travamento/deadlock do fluxo de autenticação.
supabaseClient.auth.onAuthStateChange((event,session)=>{
 setTimeout(async()=>{
   try{
     if(event==="PASSWORD_RECOVERY"){
       authUser=session?.user||null;
       showNewPasswordScreen();
       return;
     }

     if(event==="SIGNED_OUT"){
       authUser=null;
       currentUser=null;
       render();
       return;
     }

     if((event==="SIGNED_IN"||event==="TOKEN_REFRESHED"||event==="INITIAL_SESSION") && session?.user){
       // Se o usuário voltou pelo link de recuperação, prioriza a tela de nova senha.
       if(location.hash==="#reset-password"){
         authUser=session.user;
         showNewPasswordScreen();
         return;
       }

       await loadCurrentUser(session.user);
       render();
     }
   }catch(error){
     console.error("Auth state change:",error);
   }
 },0);
});

async function login(e){
 e.preventDefault();

 const email=$("#loginEmail").value.trim().toLowerCase();
 const password=$("#loginPassword").value;
 const button=$("#loginButton");

 if(button){
   button.disabled=true;
   button.textContent="Entrando...";
 }

 setAuthMessage("","error");

 try{
   // No mobile, a autenticação pode levar mais de 8s.
   // Não usamos mais o timeout curto que gerava falso erro.
   const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});

   if(error)throw error;

   let user=data?.user||null;

   // Caso o retorno imediato venha incompleto, consulta a sessão já criada.
   if(!user){
     const {data:{session}}=await supabaseClient.auth.getSession();
     user=session?.user||null;
   }

   if(!user){
     throw new Error("Não foi possível recuperar a sessão após o login.");
   }

   // Tenta carregar o perfil até 3 vezes para tolerar atraso de rede/RLS.
   let profileLoaded=false;
   let lastProfileError=null;

   for(let attempt=0;attempt<3;attempt++){
     try{
       await loadCurrentUser(user);
       if(currentUser){
         try{await syncMyTeamsFromSignupMetadata()}catch(error){console.warn(error)}
         try{await syncExistingPushSubscriptionV13()}catch(error){console.warn(error)}
         profileLoaded=true;
         break;
       }
     }catch(err){
       lastProfileError=err;
     }
     await new Promise(resolve=>setTimeout(resolve,700));
   }

   if(!profileLoaded){
     console.error("Falha ao carregar perfil:",lastProfileError);
     throw new Error("Login realizado, mas o perfil não pôde ser carregado.");
   }

   route="dashboard";
   location.hash="dashboard";
   await render();

 }catch(error){
   console.error("Erro no login:",error);

   // Verifica se a autenticação foi concluída apesar de eventual falha/atraso.
   try{
     const {data:{session}}=await supabaseClient.auth.getSession();
     if(session?.user){
       await loadCurrentUser(session.user);
       if(currentUser){
         route="dashboard";
         location.hash="dashboard";
         await render();
         return;
       }
     }
   }catch(sessionError){
     console.error("Erro ao recuperar sessão:",sessionError);
   }

   let message="Não foi possível entrar. Confira seu e-mail e sua senha.";
   const raw=(error?.message||"").toLowerCase();

   if(raw.includes("invalid login credentials")){
     message="E-mail ou senha incorretos.";
   }else if(raw.includes("email not confirmed")){
     message="Seu e-mail ainda precisa ser confirmado.";
   }else if(raw.includes("profile")){
     message="O login foi aceito, mas houve um problema ao carregar seu perfil.";
   }else if(raw.includes("network") || raw.includes("fetch")){
     message="A conexão com o servidor falhou. Tente novamente.";
   }

   setAuthMessage(message,"error");

   if(button){
     button.disabled=false;
     button.textContent="Entrar";
   }
 }
}

 e.preventDefault();
 const name=$("#regName").value.trim();
 const email=$("#regEmail").value.trim().toLowerCase();
 const password=$("#regPassword").value;
 const selectedTeams=[...document.querySelectorAll(".regTeamCheck:checked")].map(x=>x.value);

 if(!selectedTeams.length){
   setAuthMessage("Escolha pelo menos 1 equipe para continuar.","error");
   return;
 }
 if(selectedTeams.length>2){
   setAuthMessage("Você pode escolher no máximo 2 equipes.","error");
   return;
 }

 const {data,error}=await supabaseClient.auth.signUp({
   email,
   password,
   options:{
     data:{
       name,
       area:selectedTeams[0]||"Membro",
       selected_teams:selectedTeams
     }
   }
 });

 if(error){
   console.error("Erro ao criar conta:",error);
   setAuthMessage(error.message||"Não foi possível criar a conta.","error");
   return;
 }

 if(data.session){
   await loadCurrentUser();

   // O trigger do Supabase já tenta criar member_teams.
   // Fazemos também uma sincronização extra quando a sessão já está ativa.
   try{
     await syncMyTeamsFromSignupMetadata();
   }catch(error){
     console.warn("Sincronização inicial das equipes:",error);
   }

   route="dashboard";
   location.hash="dashboard";
   render();
 }else{
   setAuthMessage("Conta criada. Confirme seu e-mail e depois faça login. As equipes escolhidas serão vinculadas automaticamente.","success");
 }
}

 location.hash="";

}

function routeTitle(){
  if(route.startsWith("team-")){
    const t=teamById(Number(route.split("-")[1]));
    return t?.name||"Equipe";
  }
  if(route==="equipe")return "Equipe";
  if(route==="candidaturas")return "Candidaturas";
  if(route==="manual")return "Manual da LINE";
  return titles()[route]||"LINE";
}
function routeSubtitle(){
  if(route.startsWith("team-"))return "Tarefas, produção e entregas da equipe.";
  if(route==="equipe")return "Membros, equipes e candidaturas em um só lugar.";
  if(route==="candidaturas")return "Analise e gerencie as inscrições recebidas.";
  if(route==="manual")return "Direcionamentos oficiais para servir e produzir com a LINE.";
  return subtitles()[route]||"";
}

function calendarPage(){
  const y=calendarCursor.getFullYear();
  const m=calendarCursor.getMonth();
  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);
  const offset=(first.getDay()+6)%7;
  const prevLast=new Date(y,m,0).getDate();
  const today=new Date();

  let cells=[];
  for(let i=0;i<42;i++){
    let day,cm=m,cy=y,muted=false;
    if(i<offset){day=prevLast-offset+i+1;cm=m-1;muted=true}
    else if(i>=offset+last.getDate()){day=i-(offset+last.getDate())+1;cm=m+1;muted=true}
    else day=i-offset+1;

    const d=new Date(cy,cm,day);
    const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const evs=(db.events||[]).filter(e=>e.date===iso);
    const isToday=d.toDateString()===today.toDateString();

    cells.push(`<div class="v143-day ${muted?"muted":""} ${isToday?"today":""}">
      <div class="v143-day-num">${day}</div>
      ${evs.map(e=>`<div class="v143-cal-event" title="${e.name}">${e.time||""} ${e.name}</div>`).join("")}
    </div>`);
  }

  const month=calendarCursor.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  const thisMonth=(db.events||[]).filter(e=>{
    const d=new Date(e.date+"T12:00:00");
    return d.getMonth()===m&&d.getFullYear()===y;
  });

  const activeMembers=(V8.members||db.members||[]).filter(x=>x.active!==false).length;
  const future=(db.events||[]).filter(e=>new Date(e.date+"T23:59:59")>=new Date()).length;
  const confirmed=(V8.schedules||[]).filter(s=>s.status==="confirmed").length;
  const pending=(V8.schedules||[]).filter(s=>s.status==="pending").length;
  const declined=(V8.schedules||[]).filter(s=>s.status==="declined").length;

  return `<div class="v143-calendar-page">
    <div class="page-toolbar">
      <div class="page-title">
        <h2>Calendário</h2>
        <p>Veja datas, eventos e escalas em um calendário real.</p>
      </div>
    </div>

    <section class="v143-calendar-kpis">
      <div class="v143-calendar-kpi">
        <i>${icon("users")}</i>
        <div><small>Membros ativos</small><strong>${activeMembers}</strong><span>na equipe</span></div>
      </div>
      <div class="v143-calendar-kpi">
        <i>${icon("calendar-days")}</i>
        <div><small>Próximos eventos</small><strong>${future}</strong><span>agendados</span></div>
      </div>
      <div class="v143-calendar-kpi">
        <i>${icon("clock-3")}</i>
        <div><small>Pendentes</small><strong>${pending}</strong><span>aguardando</span></div>
      </div>
      <div class="v143-calendar-kpi">
        <i>${icon("check")}</i>
        <div><small>Confirmados</small><strong>${confirmed}</strong><span>escalados</span></div>
      </div>
    </section>

    <section class="v143-calendar-layout">
      <article class="v143-calendar-main">
        <div class="v143-calendar-head">
          <h3>${month}</h3>
          <div class="v143-cal-nav">
            <button onclick="moveMonth(-1)">${icon("chevron-left")}</button>
            <button onclick="goToday()">Hoje</button>
            <button onclick="moveMonth(1)">${icon("chevron-right")}</button>
          </div>
        </div>
        <div class="v143-calendar-weekdays">
          ${["SEG","TER","QUA","QUI","SEX","SÁB","DOM"].map(x=>`<div>${x}</div>`).join("")}
        </div>
        <div class="v143-calendar-grid">${cells.join("")}</div>
      </article>

      <aside class="v143-calendar-side">
        <article class="v143-calendar-side-card">
          <h3>${icon("calendar-days")} Eventos do mês</h3>
          ${thisMonth.length?thisMonth.map(e=>`<div class="v143-side-event">
            <b>${e.name}</b>
            <p>${new Date(e.date+"T12:00:00").toLocaleDateString("pt-BR")} • ${e.time||"--:--"}</p>
            <p>${e.place||"Local a confirmar"}</p>
          </div>`).join(""):`<p style="font-size:12px;color:var(--muted)">Nenhum evento neste mês.</p>`}
        </article>

        <article class="v143-calendar-side-card">
          <h3>Resumo das escalas</h3>
          <div class="v143-scale-summary">
            <div class="v143-scale-row">
              <div class="v143-scale-copy"><b>Confirmadas</b><small>Presença garantida</small></div>
              <span class="v143-scale-count green">${confirmed}</span>
            </div>
            <div class="v143-scale-row">
              <div class="v143-scale-copy"><b>Pendentes</b><small>Aguardando resposta</small></div>
              <span class="v143-scale-count yellow">${pending}</span>
            </div>
            <div class="v143-scale-row">
              <div class="v143-scale-copy"><b>Recusadas</b><small>Não poderão servir</small></div>
              <span class="v143-scale-count gray">${declined}</span>
            </div>
          </div>
          <button class="v143-manage-btn" onclick="navigateLine('escalas')">Gerenciar escalas</button>
        </article>
      </aside>
    </section>
  </div>`;
}

window.sendLoggedUserPasswordReset=async function(){
  const email=currentUser?.email;
  if(!email)return;

  if(!confirm(`Enviar um link para redefinir a senha de ${email}?`))return;

  try{
    const redirectTo=`${window.location.origin}${window.location.pathname}#reset-password`;
    const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo});
    if(error)throw error;
    alert("Link de recuperação enviado para o seu e-mail.");
  }catch(error){
    console.error(error);
    alert("Não foi possível enviar o link agora. Tente novamente em alguns minutos.");
  }
};

function enforceTeamLimit(changed){

  if(selected.length>2){
    changed.checked=false;
    alert("Você pode escolher no máximo 2 equipes.");

}


window.deleteMemberProfile=async function(userId,userName){
  if(!isMaster()){
    alert("Apenas um Master pode excluir contas.");
    return;
  }
  if(String(userId)===String(currentUser.id)){
    alert("Você não pode apagar a própria conta por esta tela.");
    return;
  }
  if(!confirm(`Excluir definitivamente a conta de ${userName}?`))return;
  if(prompt(`Digite EXCLUIR ${userName} para confirmar:`)!==`EXCLUIR ${userName}`){
    alert("Confirmação cancelada.");
    return;
  }

  try{
    let result=await supabaseClient.rpc("master_delete_member_account",{p_user_id:userId});

    if(result.error){
      console.warn("RPC v11.2 falhou, tentando RPC anterior.",result.error);
      result=await supabaseClient.rpc("master_delete_member_profile",{p_user_id:userId});
    }

    if(result.error)throw result.error;

    closeModal();
    await ensureV8State(true);
    alert(`A conta de ${userName} foi excluída com sucesso.`);
    await render();
  }catch(error){
    console.error("Erro ao excluir conta:",error);
    alert(
      "Não foi possível excluir a conta. Rode o arquivo setup_v11_2_delete_account.sql no Supabase e tente novamente.\n\n"+
      (error?.message||"Erro desconhecido.")
    );
  }
};

function previewSelectedAvatar(input){
  const file=input?.files?.[0];
  if(!file)return;

  const maxSize=5*1024*1024;
  if(!file.type?.startsWith("image/")){
    alert("Selecione uma imagem válida.");
    input.value="";
    return;
  }
  if(file.size>maxSize){
    alert("A foto deve ter no máximo 5 MB.");
    input.value="";
    return;
  }

  const nameEl=document.getElementById("avatarFileName");
  if(nameEl)nameEl.textContent=file.name;

  const preview=document.getElementById("avatarPreview");
  if(!preview)return;

  const reader=new FileReader();
  reader.onload=()=>{
    preview.innerHTML=`<img src="${reader.result}" alt="Prévia da nova foto">`;
  };
  reader.readAsDataURL(file);
}

async function saveRealProfile(userId){
  const members=await fetchMembersReal();
  const u=members.find(x=>x.id===userId); if(!u)return;
  const own=u.id===currentUser.id;
  const canAdmin=isMaster();

  let photoUrl=u.photo_url||null;
  if(own){
    const file=document.getElementById("realAvatarFile")?.files?.[0];
    if(file){
      const uploaded=await uploadAvatarFile(file);
      if(!uploaded)return;
      photoUrl=uploaded;
    }
    const {error}=await supabaseClient.rpc("update_my_profile",{
      p_name:document.getElementById("rpName").value.trim()||u.name,
      p_phone:document.getElementById("rpPhone").value.trim(),
      p_photo_url:photoUrl
    });
    if(error){console.error(error);alert("Não foi possível salvar seu perfil.");return}
  }else if(canAdmin){
    const {error}=await supabaseClient.from("profiles").update({
      name:document.getElementById("rpName").value.trim()||u.name,
      phone:document.getElementById("rpPhone").value.trim(),
      role:document.getElementById("rpRole").value,
      leadership_role:document.getElementById("rpLeadership").value.trim()||null,
      active:document.getElementById("rpActive").value==="true"
    }).eq("id",userId);
    if(error){console.error(error);alert("Não foi possível atualizar o membro.");return}
  }

  if((own||canAdmin) && u.name!=="Michel Macedo"){
    const selectedTeams=[...document.querySelectorAll(".rpTeamCheck:checked")].map(x=>x.value);
    const teamsSaved=await setMemberTeams(userId,selectedTeams);
    if(teamsSaved===false)return;
  }

  if(own)await loadCurrentUser(authUser);
  closeModal();
  await render();
}

async function saveProfile(id){
 const isSelf=String(id)===String(currentUser?.id);
 if(isSelf){
   const name=$("#pName").value.trim()||currentUser.name;
   const phone=$("#pPhone").value.trim();
   const photo_url=$("#pPhoto").value.trim();
   const email=$("#pEmail").value.trim().toLowerCase()||currentUser.email;

   const {error:profileError}=await supabaseClient
     .from("profiles")
     .update({name,phone,photo_url})
     .eq("id",currentUser.id);

   if(profileError){
     console.error(profileError);
     alert("Não foi possível salvar o perfil.");
     return;
   }

   if(email!==currentUser.email){
     const {error:emailError}=await supabaseClient.auth.updateUser({email});
     if(emailError){
       console.error(emailError);
       alert("Perfil salvo, mas não foi possível alterar o e-mail.");
     }
   }

   await loadCurrentUser();
   closeModal();
   render();
   return;
 }

 const u=db.users.find(x=>x.id===id);
 if(!u||!isMaster())return;
 u.name=$("#pName").value.trim()||u.name;
 u.phone=$("#pPhone").value.trim();
 u.photo=$("#pPhoto").value.trim();
 u.area=$("#pArea").value.trim()||u.area;
 save();
 closeModal();
 render();
}

window.openModal=function(content,options={}){
  document.querySelectorAll(".modal-bg").forEach(el=>el.remove());

  const backdrop=document.createElement("div");
  backdrop.className="modal-bg active-modal";
  backdrop.setAttribute("role","presentation");

  const modal=document.createElement("div");
  modal.className=`modal ${options.className||""}`.trim();
  modal.setAttribute("role","dialog");
  modal.setAttribute("aria-modal","true");

  modal.innerHTML=content;
  backdrop.appendChild(modal);

  backdrop.addEventListener("click",event=>{
    if(event.target===backdrop)closeModal();
  });

  modal.addEventListener("click",event=>event.stopPropagation());

  document.body.appendChild(backdrop);
  document.body.classList.add("modal-open");

  requestAnimationFrame(()=>{
    backdrop.classList.add("is-visible");
    const focusable=modal.querySelector("button,input,select,textarea,a[href]");
    focusable?.focus({preventScroll:true});
  });

  refreshIcons();
  return modal;
};

window.closeModal=function(){
  const backdrop=document.querySelector(".modal-bg");
  if(!backdrop)return;
  backdrop.classList.remove("is-visible");
  document.body.classList.remove("modal-open");
  setTimeout(()=>backdrop.remove(),120);
};

/* ===== V9.7 — cache de estado do Supabase ===== */
let V8_LAST_LOAD=0;
let V8_LOADING_PROMISE=null;
const V8_CACHE_MS=20000;

function v8HasBaseData(){
  return Array.isArray(V8.teams) && Array.isArray(V8.members) && Array.isArray(V8.memberTeams)
    && (V8.teams.length>0 || V8.members.length>0);
}

async function ensureV8State(force=false){
  const fresh=Date.now()-V8_LAST_LOAD < V8_CACHE_MS;
  if(!force && fresh && v8HasBaseData())return V8;

  if(V8_LOADING_PROMISE)return V8_LOADING_PROMISE;

  V8_LOADING_PROMISE=(async()=>{
    try{
      await loadV8State();
      V8_LAST_LOAD=Date.now();
      return V8;
    }finally{
      V8_LOADING_PROMISE=null;
    }
  })();

  return V8_LOADING_PROMISE;
}

function refreshV8InBackground(){
  if(Date.now()-V8_LAST_LOAD < V8_CACHE_MS)return;
  ensureV8State(true).catch(err=>console.warn("Atualização em segundo plano:",err));
}

window.loadV8State = async function(){
  if(!currentUser)return;
  const safeQuery=async(promise,label)=>{
    try{
      return await Promise.race([
        promise,
        new Promise(resolve=>setTimeout(()=>resolve({data:[],error:new Error(label+" timeout")}),6500))
      ]);
    }catch(error){
      return {data:[],error};
    }
  };
  const requests=[
    safeQuery(supabaseClient.from("events").select("*").order("event_date",{ascending:true}).order("start_time",{ascending:true}),"events"),
    safeQuery(supabaseClient.from("teams").select("*").eq("active",true).order("name"),"teams"),
    safeQuery(supabaseClient.from("profiles").select("id,name,email,phone,photo_url,role,leadership_role,active,created_at").order("name"),"profiles"),
    safeQuery(supabaseClient.from("member_teams").select("user_id,team_id"),"member_teams"),
    safeQuery(isMaster()
      ? (async()=>{
          const direct=await supabaseClient.from("availability").select("*");
          if(!direct.error && Array.isArray(direct.data) && direct.data.length>0)return direct;

          const rpc=await supabaseClient.rpc("master_get_availability");
          if(!rpc.error)return {data:rpc.data||[],error:null};

          if(!direct.error)return direct;
          return rpc;
        })()
      : supabaseClient.from("availability").select("*").eq("user_id",currentUser.id),"availability"),
    safeQuery(isMaster()
      ? (async()=>{
          const direct=await supabaseClient.from("schedules").select("*").order("id",{ascending:false});
          if(!direct.error && Array.isArray(direct.data) && direct.data.length>0)return direct;

          // Fallback para Master: contorna policy antiga que eventualmente
          // permite confirmar a própria escala, mas não permite o Master ver todas.
          const rpc=await supabaseClient.rpc("master_get_schedules");
          if(!rpc.error)return {data:rpc.data||[],error:null};

          // Se não houver registros, mantém o retorno direto apenas quando ele
          // realmente foi uma consulta válida.
          if(!direct.error)return direct;
          return rpc;
        })()
      : supabaseClient.from("schedules").select("*").eq("user_id",currentUser.id).order("id",{ascending:false}),"schedules"),
    safeQuery(supabaseClient.from("notifications").select("*").eq("user_id",currentUser.id).order("created_at",{ascending:false}),"notifications"),
    isMaster()
      ? safeQuery(supabaseClient.from("activity_logs").select("*").order("created_at",{ascending:false}).limit(20),"activity_logs")
      : Promise.resolve({data:[],error:null})
  ];
  const [events,teams,members,memberTeams,availability,schedules,notifications,logs]=await Promise.all(requests);
  for(const item of [events,teams,members,memberTeams,availability,schedules,notifications,logs]){
    if(item?.error)console.error("V8 load error:",item.error);
  }
  if(!events.error)V8.events=events.data||[];
  if(!teams.error)V8.teams=teams.data||[];
  if(!members.error)V8.members=members.data||[];
  if(!memberTeams.error)V8.memberTeams=memberTeams.data||[];
  if(!availability.error)V8.availability=availability.data||[];
  if(!schedules.error)V8.schedules=schedules.data||[];
  if(!notifications.error)V8.notifications=notifications.data||[];
  if(!logs.error)V8.logs=logs.data||[];
  V8_LAST_LOAD=Date.now();
}


let LINE_SCHEDULES_CHANNEL=null;
let LINE_AVAILABILITY_CHANNEL=null;
let LINE_SCHEDULES_REFRESH_TIMER=null;
let LINE_AVAILABILITY_REFRESH_TIMER=null;

window.initSchedulesRealtime=function(){
  if(!currentUser || LINE_SCHEDULES_CHANNEL)return;

  LINE_SCHEDULES_CHANNEL=supabaseClient
    .channel("line-schedules-live")
    .on(
      "postgres_changes",
      {event:"*",schema:"public",table:"schedules"},
      ()=>{
        clearTimeout(LINE_SCHEDULES_REFRESH_TIMER);
        LINE_SCHEDULES_REFRESH_TIMER=setTimeout(async()=>{
          try{
            await ensureV8State(true);

            // Atualiza automaticamente justamente as telas onde a resposta
            // de escala precisa aparecer para liderança ou membro.
            if(["dashboard","escalas","indicadores","eventos"].includes(route)){
              await render();
            }
          }catch(error){
            console.warn("Falha na atualização ao vivo das escalas:",error);
          }
        },180);
      }
    )
    .subscribe(status=>{
      if(status==="CHANNEL_ERROR"){
        console.warn("Realtime de escalas indisponível. O app continuará atualizando por consulta.");
      }
    });
};


window.initAvailabilityRealtime=function(){
  if(!currentUser || LINE_AVAILABILITY_CHANNEL)return;

  LINE_AVAILABILITY_CHANNEL=supabaseClient
    .channel("line-availability-live")
    .on(
      "postgres_changes",
      {event:"*",schema:"public",table:"availability"},
      ()=>{
        clearTimeout(LINE_AVAILABILITY_REFRESH_TIMER);
        LINE_AVAILABILITY_REFRESH_TIMER=setTimeout(async()=>{
          try{
            await ensureV8State(true);
            if(["dashboard","escalas","eventos"].includes(route)){
              await render();
            }
          }catch(error){
            console.warn("Falha na atualização ao vivo da disponibilidade:",error);
          }
        },180);
      }
    )
    .subscribe(status=>{
      if(status==="CHANNEL_ERROR"){
        console.warn("Realtime de disponibilidade indisponível. O botão Atualizar continua funcionando.");
      }
    });
};

window.stopSchedulesRealtime=async function(){
  clearTimeout(LINE_SCHEDULES_REFRESH_TIMER);
  clearTimeout(LINE_AVAILABILITY_REFRESH_TIMER);

  if(LINE_SCHEDULES_CHANNEL){
    try{await supabaseClient.removeChannel(LINE_SCHEDULES_CHANNEL)}catch(error){}
    LINE_SCHEDULES_CHANNEL=null;
  }

  if(LINE_AVAILABILITY_CHANNEL){
    try{await supabaseClient.removeChannel(LINE_AVAILABILITY_CHANNEL)}catch(error){}
    LINE_AVAILABILITY_CHANNEL=null;
  }
};

window.updateMyScheduleStatus = async function(scheduleId,status){
  const id=Number(scheduleId);

  // Primeira opção: RPC segura no Supabase.
  const {error:rpcError}=await supabaseClient.rpc("update_my_schedule_status",{
    p_schedule_id:id,
    p_status:status
  });

  if(!rpcError){
    await ensureV8State(true);
    await render();
    return;
  }

  console.warn("RPC update_my_schedule_status falhou, tentando update protegido por RLS:",rpcError);

  // Fallback: update direto. Só funciona para a própria escala, conforme policy RLS do patch v8.3.
  const {error:updateError}=await supabaseClient
    .from("schedules")
    .update({status})
    .eq("id",id)
    .eq("user_id",currentUser.id);

  if(updateError){
    console.error("Não foi possível atualizar a escala:",updateError);
    alert(
      "Não foi possível confirmar a escala. Atualize a página e tente novamente. " +
      "Se continuar, o administrador precisa executar o patch SQL v8.3 no Supabase."
    );
    return;
  }

  await ensureV8State(true);
  await render();
}

window.saveEvent = async function(eventId=null){
  const payload={
    name:document.getElementById("eName").value.trim(),
    event_date:document.getElementById("eDate").value,
    start_time:document.getElementById("eTime").value,
    end_time:document.getElementById("eEndTime").value||null,
    location:document.getElementById("ePlace").value.trim(),
    description:document.getElementById("eDescription").value.trim()||null,
    status:document.getElementById("eStatus").value,
    created_by:currentUser.id
  };
  if(!payload.name||!payload.event_date||!payload.start_time)return alert("Preencha nome, data e horário.");
  let response;
  if(eventId)response=await supabaseClient.from("events").update(payload).eq("id",eventId);
  else response=await supabaseClient.from("events").insert(payload);
  if(response.error){console.error(response.error);alert("Não foi possível salvar o evento.");return}
  await writeLog(eventId?`Atualizou o evento ${payload.name}`:`Criou o evento ${payload.name}`,"event",eventId||"",payload);
  closeModal();await ensureV8State(true);await render();
}

window.deleteEvent = async function(id){
  if(!isMaster())return;
  const e=eventById(Number(id));
  if(!e)return;
  if(!confirm(`Apagar definitivamente o evento "${e.name}"? As escalas vinculadas também podem ser afetadas.`))return;

  try{
    const {error}=await supabaseClient.rpc("line_delete_event",{p_event_id:Number(id)});
    if(error){
      const fallback=await supabaseClient.from("events").delete().eq("id",Number(id));
      if(fallback.error)throw fallback.error;
    }
    closeModal();
    await ensureV8State(true);
    alert("Evento apagado com sucesso.");
    navigateLine("eventos");
  }catch(error){
    alert("Não foi possível apagar o evento: "+(error?.message||error));
  }
};

window.calendarPage = async function(){
  const y=calendarCursor.getFullYear(),m=calendarCursor.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),start=(first.getDay()+6)%7,prevLast=new Date(y,m,0).getDate();
  let cells=[];
  for(let i=0;i<42;i++){
    let day,cm=m,cy=y,muted=false;
    if(i<start){day=prevLast-start+i+1;cm=m-1;muted=true}
    else if(i>=start+last.getDate()){day=i-(start+last.getDate())+1;cm=m+1;muted=true}
    else day=i-start+1;
    const d=new Date(cy,cm,day),iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const evs=V8.events.filter(e=>e.event_date===iso);
    cells.push(`<div class="day ${muted?"muted":""} ${d.toDateString()===new Date().toDateString()?"line-today-v121":""}"><div class="day-num">${day}</div>${evs.map(e=>`<div class="cal-event ${e.status==="open_schedule"?"yellow":e.status==="confirmed"?"blue":"purple"} clickable" data-event-open="${e.id}">${e.start_time?.slice(0,5)||""} ${e.name}</div>`).join("")}</div>`)
  }
  const month=calendarCursor.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});

window.availabilityStatusMeta=function(status){
  if(status==="available")return {label:"Disponível",icon:"circle-check",className:"available"};
  if(status==="unavailable")return {label:"Indisponível",icon:"circle-x",className:"unavailable"};
  return {label:"Não respondeu",icon:"clock-3",className:"pending"};
};

window.teamNamesForMember=function(userId){
  return (V8.memberTeams||[])
    .filter(mt=>String(mt.user_id)===String(userId))
    .map(mt=>V8.teams.find(t=>Number(t.id)===Number(mt.team_id))?.name)
    .filter(Boolean);
};

window.renderAvailabilityRoster=function(eventId,teamFilter="all"){
  const members=(V8.members||[])
    .filter(m=>m.active && m.role==="member" && m.name!=="Michel Macedo")
    .map(m=>{
      const teams=teamNamesForMember(m.id);
      const status=availabilityFor(eventId,m.id);
      return {member:m,teams,status};
    })
    .filter(item=>teamFilter==="all" || item.teams.includes(teamFilter))
    .sort((a,b)=>{
      const rank={available:0,pending:1,unavailable:2};
      const d=(rank[a.status]??1)-(rank[b.status]??1);
      return d || String(a.member.name||"").localeCompare(String(b.member.name||""),"pt-BR");
    });

  if(!members.length){
    return `<div class="availability-roster-empty">${icon("users")}Nenhum membro encontrado para este filtro.</div>`;
  }

  return `<div class="availability-roster-list">
    ${members.map(({member,teams,status})=>{
      const meta=availabilityStatusMeta(status);
      return `<div class="availability-person-row availability-${meta.className}">
        <div class="availability-person-main">
          ${avatarHTML({...member,photo:member.photo_url||""},"avatar")}
          <div>
            <b>${member.name||"Membro"}</b>
            <small>${teams.length?teams.join(" • "):"Sem equipe definida"}</small>
          </div>
        </div>
        <span class="availability-status-pill ${meta.className}">
          ${icon(meta.icon)}${meta.label}
        </span>
      </div>`;
    }).join("")}
  </div>`;
};
